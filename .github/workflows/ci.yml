name: CI

# Server-side gate (Tier A). Nothing here needs a secret:
# - `npm run build` = vite build + SW stamp + no-names dist guard (VITE_* absent -> inlined undefined, build still passes)
# - `npm run test:unit` = vitest; the server-side files it imports only lazy-require @sentry/node behind a DSN, so no functions deps are needed
# This is the backstop the local pre-push hook can never be for PRs pushed from off-machine (e.g. Dependabot).
#
# The emulator tiers run as their own jobs (they need Java + the Firebase emulator, still secret-free —
# every test uses the `demo-crypto-idea` demo project, no credentials):
# - rules-tests       = test:rules       (firestore emulator only) — the firestore.rules security boundary
# - integration-tests = test:integration (auth+firestore+functions emulators) — the only tier that runs a callable body

on:
  push:
    branches: [master, 'claude/**']
  pull_request:
    branches: [master]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-unit:
    name: build + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (root)
        run: npm ci

      - name: Build (vite + SW stamp + no-names dist guard)
        run: npm run build

      - name: Unit tests (vitest)
        run: npm run test:unit

  rules-tests:
    name: rules tests (firestore emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Java 21 (Firestore emulator runtime)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Firebase emulator binaries
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: firebase-emulators-${{ runner.os }}-

      - name: Install dependencies (root — includes firebase-tools)
        run: npm ci

      - name: Firestore rules tests
        run: npm run test:rules

  integration-tests:
    name: integration tests (auth+firestore+functions emulators)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Java 21 (Firestore emulator runtime)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Firebase emulator binaries
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: firebase-emulators-${{ runner.os }}-

      - name: Install dependencies (root — includes firebase-tools)
        run: npm ci

      - name: Install functions dependencies (functions emulator loads functions/index.js)
        run: npm ci --prefix functions

      - name: Integration tests (live callables over HTTP)
        # AI_PROVIDER_BASE points the Wave-B AI proxy (functions/ai-provider.js) at a LOCAL stub
        # instead of a real, network-blocked provider endpoint. `firebase emulators:exec` runs the
        # emulator AND the test in ONE process tree that inherits this env, so the emulator's proxy
        # and the in-test withStub() server agree on the same origin. The researchAsk tests also set
        # ai.baseUrl in admin config to the same origin (the production path), so the stub is reached
        # even without this env — but keep it so the two always agree. Must match the withStub()
        # fallback in tests/functions-callable.test.js.
        env:
          AI_PROVIDER_BASE: http://127.0.0.1:8791
        run: npm run test:integration
