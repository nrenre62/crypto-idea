<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#FFFFFF" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Crypto Idea" />
  <meta name="description" content="Crypto portfolio tracker and DCA calculator" />

  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json" />

  <!-- Apple Touch Icons (generate these at 180x180px) -->
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-96.png" />

  <title>Crypto Idea</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      background: #FFFFFF;
      color: #1A1A1A;
      -webkit-font-smoothing: antialiased;
      /* Safe area for iPhone notch */
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    #root { max-width: 430px; margin: 0 auto; min-height: 100vh; }

    /* Loading screen before React loads */
    .app-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 12px;
    }
    .app-loading h1 { font-size: 28px; font-weight: 200; letter-spacing: -0.5px; }
    .app-loading h1 span { font-weight: 700; }
    .app-loading p { font-size: 13px; color: #999; }
  </style>
</head>
<body>
  <div id="root">
    <!-- Shown while React loads -->
    <div class="app-loading">
      <h1>Crypto <span>Idea</span></h1>
      <p>Loading...</p>
    </div>
  </div>

  <!-- Register service worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js')
          .then(reg => console.log('SW registered:', reg.scope))
          .catch(err => console.log('SW registration failed:', err));
      });
    }
  </script>

  <!-- React app bundle (built by Vite) -->
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
