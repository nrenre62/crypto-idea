<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Never index the admin panel. (Defense in depth — the real gate is the
       server-side {admin:true} claim, not this tag.) -->
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#FFFFFF" />
  <title>CryptoIdea — Admin</title>
  <!-- Paper-design type (Fraunces + Hanken Grotesk) for the ADMIN-D Settings reskin.
       Same font hosts the app already allowlists in the CSP. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      /* ADMIN-UI-1: paper background for a consistent first paint with the .ci-app app. */
      background: #faf9f5; color: #1A1A1A; -webkit-font-smoothing: antialiased;
    }
    #root { min-height: 100vh; }
    .app-loading { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 12px; color: #999; font-size: 14px; }
    /* LOGO-2: the unified brand lockup — green "C" tile + one-word "CryptoIdea".
       Brand green #0b6b4f (the landing --accent); no app tokens exist pre-bundle. */
    .app-loading .lockup { display: flex; align-items: center; gap: 10px; }
    .app-loading .mark {
      width: 28px; height: 28px; border-radius: 8px; background: #0b6b4f; color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Fraunces', Georgia, serif; font-size: 16px; font-weight: 600;
    }
    .app-loading .word { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; color: #1A1A1A; }
  </style>
</head>
<body>
  <div id="root">
    <div class="app-loading">
      <div class="lockup"><span class="mark">C</span><span class="word">CryptoIdea</span></div>
      <p>Loading…</p>
    </div>
  </div>
  <!-- Separate entry: the admin code is NOT bundled into the user app. No service
       worker here — the admin panel is a plain page, not an installable PWA. -->
  <script type="module" src="/src/admin-main.jsx"></script>
</body>
</html>
