<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#FFFFFF" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Crypto Idea" />
  <meta name="description" content="Crypto portfolio tracker and DCA calculator" />

  <!-- PWA Manifest + icons -->
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="96x96" href="/icons/icon-96.png" />

  <title>Crypto Idea</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      background: #FFFFFF;
      color: #1A1A1A;
      -webkit-font-smoothing: antialiased;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    /* The tracker self-constrains to 430px internally. */
    #root { min-height: 100vh; }

    .app-loading {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; gap: 12px;
    }
    .app-loading h1 { font-size: 28px; font-weight: 200; letter-spacing: -0.5px; }
    .app-loading h1 span { font-weight: 700; }
    .app-loading p { font-size: 13px; color: #999; }
  </style>
</head>
<body>
  <div id="root">
    <div class="app-loading">
      <h1>Crypto <span>Idea</span></h1>
      <p>Loading...</p>
    </div>
  </div>

  <!-- Service worker: only in production. In local dev, unregister any existing
       one and clear caches so you never see a stale page while developing. -->
  <script>
    (function () {
      if (!('serviceWorker' in navigator)) return;
      var isLocal = ['localhost', '127.0.0.1', ''].includes(location.hostname);
      if (isLocal) {
        navigator.serviceWorker.getRegistrations().then(function (rs) {
          rs.forEach(function (r) { r.unregister(); });
        });
        if (window.caches) caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); });
      } else {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/service-worker.js').then(function (reg) {
            // When a NEW version is deployed, auto-refresh this tab (skip first install).
            reg.addEventListener('updatefound', function () {
              var nw = reg.installing;
              if (!nw) return;
              nw.addEventListener('statechange', function () {
                if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                  window.location.reload();
                }
              });
            });
          }).catch(function (err) { console.log('SW registration failed:', err); });
          // Check for a new version whenever the tab becomes visible again.
          document.addEventListener('visibilitychange', function () {
            if (document.visibilityState === 'visible') {
              navigator.serviceWorker.getRegistration().then(function (reg) { if (reg) reg.update(); });
            }
          });
        });
      }
    })();
  </script>

  <!-- Analytics + cookie consent from admin config (no-ops if unconfigured) -->
  <script src="/site-meta.js" defer></script>

  <!-- React app bundle (built by Vite) -->
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
