<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#FFFFFF" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="CryptoIdea" />
  <meta name="description" content="Crypto portfolio tracker and DCA calculator" />

  <!-- PWA Manifest + icons -->
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="96x96" href="/icons/icon-96.png" />

  <title>CryptoIdea</title>

  <!-- Fonts for the Research tab's editorial type (Fraunces + Hanken Grotesk).
       display=swap keeps text visible while they load; the rest of the app uses
       the system font stack. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      background: #FFFFFF;
      color: #1A1A1A;
      -webkit-font-smoothing: antialiased;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    /* The tracker self-constrains to 430px internally. */
    #root { min-height: 100vh; }

    .app-loading {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; gap: 12px;
    }
    /* LOGO-2: the unified brand lockup — green "C" tile + one-word "CryptoIdea".
       Brand green #0b6b4f (the landing --accent); no app tokens exist pre-bundle. */
    .app-loading .lockup { position: relative; display: flex; align-items: center; gap: 10px; }
    .app-loading .mark {
      width: 28px; height: 28px; border-radius: 8px; background: #0b6b4f; color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Fraunces', Georgia, serif; font-size: 16px; font-weight: 600;
    }
    .app-loading .word { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
    /* Static head-up turtle on the "C" tile corner (splash — no hover). */
    .app-loading .turtle { position: absolute; left: 16px; top: -13px; width: 31px; height: 31px; overflow: visible; pointer-events: none; }
    .app-loading .sh { fill: #6fbe93; } .app-loading .sk { fill: #c39a6b; } .app-loading .ey { fill: #2f2013; }
    .app-loading .sm { fill: none; stroke: #3e8e6a; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; opacity: .85; }
    .app-loading .cr { fill: none; stroke: #4fa6a8; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; }
    .app-loading .rp { fill: none; stroke: #7fc0c1; stroke-width: 1.5; stroke-linecap: round; opacity: .7; }
    .app-loading p { font-size: 13px; color: #999; }
  </style>
</head>
<body>
  <div id="root">
    <div class="app-loading">
      <div class="lockup"><span class="mark">C</span><span class="word">CryptoIdea</span><svg class="turtle" viewBox="0 0 40 38" aria-hidden="true"><g transform="translate(19 20) rotate(-28) scale(0.85)"><path class="cr" d="M-19,11 L-3,11 L2,6.4 L7,11 L21,11"/><path class="rp" d="M-13,15.5 L-4,15.5"/><path class="rp" d="M7,15.5 L17,15.5"/><g transform="translate(-11 3)"><path class="sk" d="M0,0 C-4,0 -4.6,5 -2.6,8.6 C-1,10.2 1,10.2 2.6,8.6 C4.6,5 4,0 0,0 Z"/></g><path class="sk" d="M-15,1 l-5,1.6 l4.4,3 z"/><path class="sk" d="M5,-3.4 L19,-4.2 L19,3 L5,3 Z"/><ellipse class="sk" cx="20.5" cy="-2" rx="6.2" ry="5.2"/><circle class="ey" cx="22.6" cy="-4" r="1.3"/><ellipse class="sh" cx="0" cy="-1" rx="16" ry="11"/><path class="sm" d="M-9,-6.5 C-3,-9.6 3,-9.6 9,-6.5"/><path class="sm" d="M-6,-8.4 C-8,-1 -8,4 -5,9.4"/><path class="sm" d="M6,-8.4 C8,-1 8,4 5,9.4"/><g transform="translate(9 4)"><path class="sk" d="M0,0 C-4,0 -4.6,5 -2.6,8.6 C-1,10.2 1,10.2 2.6,8.6 C4.6,5 4,0 0,0 Z"/></g></g></svg></div>
      <p>Loading…</p>
    </div>
  </div>

  <!-- Service worker: only in production. In local dev, unregister any existing
       one and clear caches so you never see a stale page while developing. -->
  <script src="/sw-register.js"></script>

  <!-- Analytics + cookie consent from admin config (no-ops if unconfigured) -->
  <script src="/site-meta.js" defer></script>

  <!-- React app bundle (built by Vite) -->
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
