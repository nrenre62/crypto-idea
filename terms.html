<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Terms of Service · Crypto Idea</title>
  <meta name="description" content="Terms of Service for Crypto Idea." />
  <style>
    :root { color-scheme: light; }
    body { margin:0; font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; color:#1A1A2E; background:#fff; line-height:1.6; }
    .wrap { max-width: 760px; margin: 0 auto; padding: 32px 20px 64px; }
    header { display:flex; align-items:center; justify-content:space-between; padding-bottom:20px; border-bottom:1px solid #eee; margin-bottom:28px; }
    .brand { font-size:18px; font-weight:300; letter-spacing:-0.3px; }
    .brand b { font-weight:700; }
    a.back { font-size:13px; color:#6C5CE7; text-decoration:none; font-weight:600; }
    h1 { font-size:26px; margin:0 0 8px; }
    .muted { color:#888; font-size:13px; margin-bottom:24px; }
    footer { margin-top:48px; padding-top:20px; border-top:1px solid #eee; font-size:12px; color:#999; }
    footer a { color:#6C5CE7; text-decoration:none; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">Crypto <b>Idea</b></div>
      <a class="back" href="/">← Back to site</a>
    </header>

    <h1>Terms of Service</h1>
    <p class="muted">The terms for using Crypto Idea.</p>

    <!-- Auto-embeds the Termly Terms document using the ID set in admin Settings
         → Analytics & Legal (Termly Terms doc ID). No code edits needed. -->
    <div id="termly-terms">
      <p>Our terms of service are being finalized. Set the <b>Termly Terms doc ID</b> in
      the admin dashboard (Settings → Analytics &amp; Legal) to publish it here.</p>
    </div>
    <script>
      fetch('/api/config').then(function(r){return r.ok?r.json():null;}).then(function(c){
        var id = c && c.legal && c.legal.termlyTermsId;
        if(!id) return;
        var host = document.getElementById('termly-terms'); host.textContent='';
        var d = document.createElement('div'); d.setAttribute('name','termly-embed'); d.setAttribute('data-id',id); d.setAttribute('data-type','iframe'); host.appendChild(d);
        var s = document.createElement('script'); s.src='https://app.termly.io/embed-policy.min.js'; s.id='termly-jssdk'; document.body.appendChild(s);
      }).catch(function(){});
    </script>

    <footer>
      <a href="/">Home</a> · <a href="/privacy.html">Privacy Policy</a>
    </footer>
  </div>
</body>
</html>
