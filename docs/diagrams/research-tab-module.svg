<svg viewBox="0 0 940 880" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
  <title>Crypto Idea — Research tab feature module (src/features/research/)</title>
  <desc>The Research tab is a self-contained vertical-slice feature module under src/features/research/ with its own components, hooks, utils, api and styles, scoped CSS under .research-root. One bridge file, Research.jsx, reads the app via useApp() (AppContext) and passes the active portfolio's coins and the app's live prices into ResearchTab.jsx, the container that owns the view + timeframe state and calls the hooks. The hooks read app-native data only: useHoldings turns the portfolio coins/entries into net amount + weighted average cost (holdingsFromCoins); usePrices combines useLivePrices (current price + 24h change) with each coin's /api/history (CDN- and module-cached) to derive 7d/30d change + a 7-day sparkline (buildResearchPrices); usePortfolio runs the pure computePortfolio/deriveRisk/portfolioContext utils; usePulse and useAsk call askClaude which throws today, so they fall back to built-in data-driven summaries. It never calls CoinGecko or Anthropic directly from the browser, so the shared /api proxy keeps backend cost flat regardless of users, and missing history degrades to 0% rather than NaN. Three views render: Overview (daily brief, Portfolio Pulse, allocation bar, risk meter, stress test), Coins (per-holding card, 7-day sparkline, cost/now/P&L, and 4-state conviction pills), and Ask (chat about the user's holdings). Two pluggable seams stay mock today and go live in Wave B: conviction.js is a pure rubric reducer with a 2-source accuracy gate, four states, reason chips and catalyst expiry, fed by mock-conviction.js until a per-coin live-AI cache replaces it; ai-client.js will be swapped for a server-side Cloud Function proxy that holds the Anthropic key and runs the fail-closed output validator.</desc>
