  <!-- why -->
  <rect x="24" y="630" width="892" height="236" rx="10" fill="var(--color-background-primary,#fff)" stroke="var(--color-border-secondary,#d0d0d0)" stroke-width="1.3"/>
  <text x="40" y="651" font-size="11.5" font-weight="700" fill="var(--color-text-primary,#1a1a1a)">Why it's built this way</text>
  <text x="40" y="671" font-size="10.5" fill="var(--color-text-secondary,#6b6b6b)">• Self-contained vertical slice — its own components / hooks / utils / api / styles behind one bridge file (Research.jsx); portable + testable in isolation.</text>
  <text x="40" y="689" font-size="10.5" fill="var(--color-text-secondary,#6b6b6b)">• Scoped CSS — every rule lives under .research-root so it can't collide with the rest of the app's .ci-app design (both reuse generic class names).</text>
  <text x="40" y="707" font-size="10.5" fill="var(--color-text-secondary,#6b6b6b)">• App-native data only — reuses the cached /api proxy + useLivePrices, so adding Research costs ZERO extra upstream calls (flat-cost model intact).</text>
  <text x="40" y="725" font-size="10.5" fill="var(--color-text-secondary,#6b6b6b)">• Never CoinGecko / Anthropic from the browser — rate limits + API keys stay server-side; the shared proxy is the single upstream.</text>
  <text x="40" y="743" font-size="10.5" fill="var(--color-text-secondary,#6b6b6b)">• Layered like the app — components (UI) → hooks (logic) → utils (pure) / api (I/O); the pure utils (portfolio / priceAdapter / conviction) are unit-tested directly.</text>
  <text x="40" y="761" font-size="10.5" fill="var(--color-text-secondary,#6b6b6b)">• Degrade, never crash — missing history → 0% not NaN; AI offline → built-in summaries, so the tab is fully usable + secure today.</text>
  <text x="40" y="779" font-size="10.5" fill="var(--color-text-secondary,#6b6b6b)">• Accuracy-gated conviction — a ≥2-source rule blocks single-source guesses; ⬛ "insufficient data" shows a reason chip, never a silent blank.</text>
  <text x="40" y="797" font-size="10.5" fill="var(--color-text-secondary,#6b6b6b)">• Clean Wave-B seam — swap mock evidence for a live per-coin AI cache, and ai-client for a server proxy guarded by the fail-closed output validator.</text>
  <text x="40" y="822" font-size="9" fill="var(--color-text-secondary,#6b6b6b)">Source: src/features/research/ — Research.jsx · components/ResearchTab.jsx + views · hooks/{useHoldings,usePrices,usePortfolio,usePulse,useAsk}.js</text>
  <text x="40" y="836" font-size="9" fill="var(--color-text-secondary,#6b6b6b)">· utils/{portfolio,priceAdapter,conviction,coins}.js · api/ai-client.js · data/mock-conviction.js · styles/research-tab.css · functions/validate-output.js (Wave B).</text>
  <text x="40" y="855" font-size="9" fill="var(--color-text-secondary,#6b6b6b)">Related: frontend-layered-architecture.svg · live-prices-polling.svg · app-buy-date-history.svg · coin-data-flow.svg.</text>
</svg>
