<svg viewBox="0 0 900 640" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
  <title>Crypto Idea — GDPR self-service &amp; soft-delete</title>
  <desc>From the app's "Privacy &amp; your data" card a signed-in user can export their own data (JSON + holdings CSV), or delete their account. Delete is a SOFT delete: it marks the user doc deleted with a timestamp and keeps the data for a 30-day grace window during which the user (or an admin) can restore it; the Auth account is not disabled, so signing back in shows a Restore screen. A daily scheduled job permanently erases accounts past 30 days. Every callable acts only on the caller's own uid (no IDOR), and the deleted/deletedAt fields are server-only.</desc>
  <defs>
    <marker id="gd_a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--color-text-secondary,#6b6b6b)"/></marker>
    <marker id="gd_d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--color-text-primary,#1a1a1a)"/></marker>
  </defs>
  <text x="24" y="28" font-size="19" font-weight="700" fill="var(--color-text-primary,#1a1a1a)">GDPR Self-Service &amp; Soft-Delete</text>
  <text x="24" y="47" font-size="12" fill="var(--color-text-secondary,#6b6b6b)">Account → "Privacy &amp; your data" · every callable acts on context.auth.uid only — no IDOR</text>
  <line x1="610" y1="26" x2="634" y2="26" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="2.5"/><text x="640" y="30" font-size="10.5" fill="var(--color-text-secondary,#6b6b6b)">user / app action</text>
  <line x1="745" y1="26" x2="769" y2="26" stroke="var(--color-text-primary,#1a1a1a)" stroke-width="2.5"/><text x="775" y="30" font-size="10.5" fill="var(--color-text-secondary,#6b6b6b)">scheduled job</text>

  <!-- App card -->
  <rect x="24" y="64" width="220" height="150" rx="10" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.6"/>
  <text x="40" y="86" font-size="12" font-weight="700" fill="var(--color-text-primary,#1a1a1a)">App · Privacy &amp; your data</text>
  <text x="40" y="103" font-size="9" fill="var(--color-text-secondary,#6b6b6b)">Account tab · signed-in user</text>
  <text x="40" y="128" font-size="10.5" fill="var(--color-text-primary,#1a1a1a)">▸ Download all my data (JSON)</text>
  <text x="40" y="150" font-size="10.5" fill="var(--color-text-primary,#1a1a1a)">▸ Download CSV (holdings)</text>
  <text x="40" y="172" font-size="10.5" fill="var(--color-text-primary,#1a1a1a)">▸ Delete my account</text>
  <text x="40" y="196" font-size="9" fill="var(--color-text-secondary,#6b6b6b)">CSV via buildPortfolioCsv()</text>

  <!-- Callables column -->
  <rect x="300" y="64" width="290" height="44" rx="9" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.5"/>
  <text x="445" y="83" font-size="11.5" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">exportMyData()</text>
  <text x="445" y="99" font-size="8.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">returns profile + portfolios→coins→transactions (caller's)</text>

  <rect x="300" y="120" width="290" height="56" rx="9" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.5"/>
  <text x="445" y="139" font-size="11.5" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">deleteMyAccount()</text>
  <text x="445" y="155" font-size="8.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">SOFT: set deleted:true + deletedAt · data kept</text>
  <text x="445" y="168" font-size="8.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">Auth NOT disabled → can sign back in · then logout</text>

  <rect x="300" y="188" width="290" height="44" rx="9" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.5"/>
  <text x="445" y="207" font-size="11.5" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">restoreMyAccount()</text>
  <text x="445" y="223" font-size="8.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">within 30d → deleted:false, deletedAt:null</text>

  <line x1="244" y1="120" x2="298" y2="86" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.3" marker-end="url(#gd_a)"/>
  <line x1="244" y1="150" x2="298" y2="148" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.3" marker-end="url(#gd_a)"/>

  <!-- export output -->
  <rect x="636" y="64" width="240" height="44" rx="9" fill="var(--color-background-primary,#fff)" stroke="var(--color-border-secondary,#d0d0d0)" stroke-width="1.3"/>
  <text x="756" y="83" font-size="10" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">browser download</text>
  <text x="756" y="98" font-size="8.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">raw JSON + Excel-ready CSV (cost-basis only)</text>
  <line x1="590" y1="86" x2="634" y2="86" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.3" marker-end="url(#gd_a)"/>

  <!-- state doc -->
  <rect x="636" y="120" width="240" height="112" rx="9" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-primary,#1a1a1a)" stroke-width="1.6"/>
  <text x="756" y="140" font-size="11" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">users/{uid}</text>
  <text x="756" y="160" font-size="10" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">deleted: true | false</text>
  <text x="756" y="178" font-size="10" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">deletedAt: &lt;ms&gt; | null</text>
  <text x="756" y="200" font-size="8.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">SERVER-ONLY fields —</text>
  <text x="756" y="213" font-size="8.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">firestore.rules deny owner writes;</text>
  <text x="756" y="226" font-size="8.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">written only by Admin-SDK callables</text>
  <line x1="590" y1="148" x2="634" y2="158" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.3" marker-end="url(#gd_a)"/>
  <line x1="590" y1="210" x2="634" y2="200" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.3" marker-end="url(#gd_a)"/>

  <!-- re-login restore path -->
  <rect x="300" y="256" width="290" height="56" rx="9" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.4"/>
  <text x="445" y="276" font-size="10.5" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">sign back in (within 30d)</text>
  <text x="445" y="292" font-size="8.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">useAuthSession reads server `deleted` flag →</text>
  <text x="445" y="305" font-size="8.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">app shows RestoreAccount.jsx, not the portfolio</text>
  <line x1="700" y1="232" x2="560" y2="254" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.3" marker-end="url(#gd_a)"/>
  <line x1="400" y1="256" x2="430" y2="234" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.3" marker-end="url(#gd_a)"/>

  <!-- timeline -->
  <text x="24" y="356" font-size="12" font-weight="700" fill="var(--color-text-primary,#1a1a1a)">Lifecycle of a deleted account</text>
  <rect x="24" y="368" width="300" height="34" rx="7" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.4"/>
  <text x="174" y="389" font-size="10" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">Day 0 — Delete (soft) · logged out</text>
  <rect x="340" y="368" width="300" height="34" rx="7" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.4"/>
  <text x="490" y="389" font-size="10" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">Days 0–30 — Trash · restorable</text>
  <rect x="656" y="368" width="220" height="34" rx="7" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-primary,#1a1a1a)" stroke-width="1.6"/>
  <text x="766" y="389" font-size="10" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">Day 30+ — Purged forever</text>
  <line x1="324" y1="385" x2="338" y2="385" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.3" marker-end="url(#gd_a)"/>
  <line x1="640" y1="385" x2="654" y2="385" stroke="var(--color-text-primary,#1a1a1a)" stroke-width="1.3" marker-end="url(#gd_d)"/>

  <!-- scheduled purge -->
  <rect x="340" y="418" width="536" height="50" rx="9" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-primary,#1a1a1a)" stroke-width="1.6"/>
  <text x="356" y="438" font-size="11" font-weight="700" fill="var(--color-text-primary,#1a1a1a)">purgeExpiredTrash — scheduled every 24h</text>
  <text x="356" y="456" font-size="9" fill="var(--color-text-secondary,#6b6b6b)">db.recursiveDelete(users/{uid}) for every account where now − deletedAt &gt; 30d · then Auth delete. Cloud Scheduler fires it in prod.</text>
  <line x1="490" y1="402" x2="490" y2="416" stroke="var(--color-text-primary,#1a1a1a)" stroke-width="1.3" marker-end="url(#gd_d)"/>

  <!-- guards -->
  <rect x="24" y="484" width="852" height="134" rx="10" fill="var(--color-background-primary,#fff)" stroke="var(--color-border-secondary,#d0d0d0)" stroke-width="1.3"/>
  <text x="40" y="506" font-size="11.5" font-weight="700" fill="var(--color-text-primary,#1a1a1a)">Guards</text>
  <text x="40" y="526" font-size="11" fill="var(--color-text-secondary,#6b6b6b)">• No IDOR: deleteMyAccount / restoreMyAccount / exportMyData read context.auth.uid only — a user can act on no one else's account.</text>
  <text x="40" y="544" font-size="11" fill="var(--color-text-secondary,#6b6b6b)">• Soft-delete fields are server-only: firestore.rules block owners from setting deleted/deletedAt (rules test covers it); only Admin-SDK callables write them.</text>
  <text x="40" y="562" font-size="11" fill="var(--color-text-secondary,#6b6b6b)">• Last admins protected: an admin can't self-delete if it would drop the system below MIN_ADMINS (countAdmins()).</text>
  <text x="40" y="580" font-size="11" fill="var(--color-text-secondary,#6b6b6b)">• Reversible by design: data is retained the full 30 days; restore clears the flags. getStats excludes trashed accounts; admins also restore/purge from the Trash tab.</text>
  <text x="40" y="600" font-size="9" fill="var(--color-text-secondary,#6b6b6b)">Source: functions/index.js — deleteMyAccount, restoreMyAccount, exportMyData, purgeExpiredTrash (TRASH_DAYS=30) · src/utils/export-csv.js · RestoreAccount.jsx · firestore.rules</text>
</svg>
