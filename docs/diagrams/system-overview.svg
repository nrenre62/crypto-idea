<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
  <title>Crypto Idea — system overview (all components)</title>
  <desc>Three browser front-ends (landing+DCA, user app, admin) served by Firebase Hosting/CDN. One Cloud Functions backend holds the CoinGecko proxy, PayPal functions, admin callables and scheduled jobs. Firestore stores user data, a locked config doc, the shared coin cache, history and an audit log. External services are CoinGecko and PayPal.</desc>
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--color-text-secondary,#6b6b6b)"/></marker>
  </defs>
  <text x="24" y="30" font-size="19" font-weight="700" fill="var(--color-text-primary,#1a1a1a)">Crypto Idea — System Overview</text>
  <text x="24" y="50" font-size="12.5" fill="var(--color-text-secondary,#6b6b6b)">Every component and how they connect. Secrets live only in the backend; only dist/ ships to the browser.</text>

  <!-- Browsers -->
  <text x="24" y="84" font-size="11.5" font-weight="700" fill="var(--color-text-secondary,#6b6b6b)">BROWSER (only dist/ ships)</text>
  <rect x="40" y="92" width="250" height="52" rx="9" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-info,#2c7fb8)" stroke-width="1.6"/>
  <text x="165" y="113" font-size="12.5" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">Landing + DCA</text>
  <text x="165" y="131" font-size="10" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">index.html · static · free calculator</text>
  <rect x="320" y="92" width="250" height="52" rx="9" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-info,#2c7fb8)" stroke-width="1.6"/>
  <text x="445" y="113" font-size="12.5" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">User App</text>
  <text x="445" y="131" font-size="10" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">app.html · React · auth + holdings</text>
  <rect x="600" y="92" width="250" height="52" rx="9" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-info,#2c7fb8)" stroke-width="1.6"/>
  <text x="725" y="113" font-size="12.5" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">Admin Dashboard</text>
  <text x="725" y="131" font-size="10" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">admin.html · {admin:true} claim</text>

  <!-- Hosting -->
  <rect x="40" y="176" width="810" height="40" rx="9" fill="var(--color-background-primary,#fff)" stroke="var(--color-border-secondary,#d0d0d0)" stroke-width="1.4"/>
  <text x="445" y="201" font-size="12.5" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">Firebase Hosting + CDN  —  serves static files, rewrites /api/** to the function, sets CSP + security headers</text>

  <!-- Functions -->
  <text x="24" y="250" font-size="11.5" font-weight="700" fill="var(--color-text-secondary,#6b6b6b)">CLOUD FUNCTIONS (backend · secrets here)</text>
  <rect x="40" y="258" width="810" height="92" rx="10" fill="none" stroke="var(--color-border-tertiary,#e2e2e2)" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="58" y="274" width="180" height="60" rx="8" fill="var(--color-background-primary,#fff)" stroke="var(--color-border-secondary,#d0d0d0)" stroke-width="1.3"/>
  <text x="148" y="298" font-size="12" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">api (proxy)</text>
  <text x="148" y="315" font-size="9.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">prices/search/history</text>
  <text x="148" y="328" font-size="9.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">coinlist/config/subscribe</text>
  <rect x="250" y="274" width="180" height="60" rx="8" fill="var(--color-background-primary,#fff)" stroke="var(--color-border-secondary,#d0d0d0)" stroke-width="1.3"/>
  <text x="340" y="298" font-size="12" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">PayPal fns</text>
  <text x="340" y="315" font-size="9.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">create/cancel sub</text>
  <text x="340" y="328" font-size="9.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">webhook (verified)</text>
  <rect x="442" y="274" width="180" height="60" rx="8" fill="var(--color-background-primary,#fff)" stroke="var(--color-border-secondary,#d0d0d0)" stroke-width="1.3"/>
  <text x="532" y="298" font-size="12" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">admin callables</text>
  <text x="532" y="315" font-size="9.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">users/tier/config</text>
  <text x="532" y="328" font-size="9.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">stats/audit (claim-gated)</text>
  <rect x="634" y="274" width="198" height="60" rx="8" fill="var(--color-background-primary,#fff)" stroke="var(--color-border-secondary,#d0d0d0)" stroke-width="1.3"/>
  <text x="733" y="298" font-size="12" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">scheduled jobs</text>
  <text x="733" y="315" font-size="9.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">refreshPrices (5m)</text>
  <text x="733" y="328" font-size="9.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">refreshUniverseDaily</text>

  <!-- Firestore -->
  <text x="24" y="384" font-size="11.5" font-weight="700" fill="var(--color-text-secondary,#6b6b6b)">FIRESTORE (security rules = the boundary)</text>
  <rect x="40" y="392" width="810" height="86" rx="10" fill="none" stroke="var(--color-border-tertiary,#e2e2e2)" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="58" y="408" width="150" height="54" rx="8" fill="var(--color-background-primary,#fff)" stroke="var(--color-border-secondary,#d0d0d0)" stroke-width="1.3"/>
  <text x="133" y="430" font-size="11.5" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">users/{uid}/…</text>
  <text x="133" y="448" font-size="9.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">owner-only · counters</text>
  <rect x="220" y="408" width="150" height="54" rx="8" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-info,#2c7fb8)" stroke-width="1.5"/>
  <text x="295" y="430" font-size="11.5" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">config/app</text>
  <text x="295" y="448" font-size="9.5" text-anchor="middle" fill="var(--color-text-info,#2c7fb8)">LOCKED (keys)</text>
  <rect x="382" y="408" width="150" height="54" rx="8" fill="var(--color-background-primary,#fff)" stroke="var(--color-border-secondary,#d0d0d0)" stroke-width="1.3"/>
  <text x="457" y="430" font-size="11.5" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">cache/universe</text>
  <text x="457" y="448" font-size="9.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">~3,000 coins</text>
  <rect x="544" y="408" width="150" height="54" rx="8" fill="var(--color-background-primary,#fff)" stroke="var(--color-border-secondary,#d0d0d0)" stroke-width="1.3"/>
  <text x="619" y="430" font-size="11.5" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">historyCache</text>
  <text x="619" y="448" font-size="9.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">per coin</text>
  <rect x="706" y="408" width="126" height="54" rx="8" fill="var(--color-background-primary,#fff)" stroke="var(--color-border-secondary,#d0d0d0)" stroke-width="1.3"/>
  <text x="769" y="430" font-size="11.5" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">audit</text>
  <text x="769" y="448" font-size="9.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">server-only</text>

  <!-- External -->
  <rect x="250" y="514" width="180" height="48" rx="9" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-primary,#1a1a1a)" stroke-width="1.8"/>
  <text x="340" y="543" font-size="12.5" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">CoinGecko API</text>
  <rect x="460" y="514" width="180" height="48" rx="9" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-primary,#1a1a1a)" stroke-width="1.8"/>
  <text x="550" y="543" font-size="12.5" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">PayPal API</text>

  <!-- connectors -->
  <line x1="445" y1="144" x2="445" y2="174" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.4" marker-end="url(#m)"/>
  <line x1="445" y1="216" x2="445" y2="256" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.4" marker-end="url(#m)"/>
  <line x1="445" y1="350" x2="445" y2="390" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.4" marker-end="url(#m)"/>
  <line x1="200" y1="334" x2="330" y2="512" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.3" marker-end="url(#m)"/>
  <line x1="360" y1="334" x2="540" y2="512" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.3" marker-end="url(#m)"/>
</svg>