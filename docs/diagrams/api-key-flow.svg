<svg viewBox="0 0 880 470" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
  <title>Crypto Idea — API key flow &amp; security</title>
  <desc>An admin types the CoinGecko key into the dashboard. saveConfig (admin-only) writes it to the locked config/app Firestore doc. The api function reads it server-side and attaches it to CoinGecko calls. Clients can never read the doc; getAdminConfig returns only a boolean set-flag, so the key value never reaches any browser.</desc>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--color-text-secondary,#6b6b6b)"/></marker>
    <marker id="gx" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 10 M10 0 L0 10" stroke="var(--color-text-primary,#b03030)" stroke-width="2"/></marker>
  </defs>
  <text x="24" y="30" font-size="19" font-weight="700" fill="var(--color-text-primary,#1a1a1a)">API Key Flow &amp; Security</text>
  <text x="24" y="50" font-size="12.5" fill="var(--color-text-secondary,#6b6b6b)">The CoinGecko (and PayPal) keys live server-side only — never in the bundle, never sent to a browser.</text>

  <!-- Admin -->
  <rect x="40" y="80" width="200" height="62" rx="9" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-info,#2c7fb8)" stroke-width="1.8"/>
  <text x="140" y="106" font-size="13" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">Admin Dashboard</text>
  <text x="140" y="125" font-size="10" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">Settings → paste key</text>

  <!-- saveConfig -->
  <rect x="330" y="80" width="200" height="62" rx="9" fill="var(--color-background-primary,#fff)" stroke="var(--color-border-secondary,#d0d0d0)" stroke-width="1.4"/>
  <text x="430" y="100" font-size="12.5" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">saveConfig()</text>
  <text x="430" y="118" font-size="9.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">callable · ADMIN-ONLY</text>
  <text x="430" y="132" font-size="9.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">verifies {admin:true}</text>

  <!-- config doc -->
  <rect x="620" y="80" width="220" height="62" rx="9" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-info,#2c7fb8)" stroke-width="2"/>
  <text x="730" y="100" font-size="12.5" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">config/app (Firestore)</text>
  <text x="730" y="118" font-size="9.5" text-anchor="middle" fill="var(--color-text-info,#2c7fb8)">rules: read,write = false</text>
  <text x="730" y="132" font-size="9.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">LOCKED — server-only</text>

  <line x1="240" y1="111" x2="328" y2="111" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.6" marker-end="url(#g)"/>
  <line x1="530" y1="111" x2="618" y2="111" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.6" marker-end="url(#g)"/>
  <text x="284" y="103" font-size="9" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">key</text>

  <!-- read path -->
  <rect x="620" y="200" width="220" height="60" rx="9" fill="var(--color-background-primary,#fff)" stroke="var(--color-border-secondary,#d0d0d0)" stroke-width="1.4"/>
  <text x="730" y="224" font-size="12" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">getConfig() → cgHeaders()</text>
  <text x="730" y="242" font-size="9.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">reads key server-side (cached 5m)</text>
  <text x="730" y="255" font-size="9.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">adds x-cg-demo-api-key header</text>
  <line x1="730" y1="142" x2="730" y2="198" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.6" marker-end="url(#g)"/>

  <rect x="620" y="318" width="220" height="48" rx="9" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-primary,#1a1a1a)" stroke-width="1.8"/>
  <text x="730" y="347" font-size="12.5" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">CoinGecko API</text>
  <line x1="730" y1="260" x2="730" y2="316" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.6" marker-end="url(#g)"/>

  <!-- client cannot read -->
  <rect x="40" y="318" width="360" height="86" rx="10" fill="var(--color-background-primary,#fff)" stroke="var(--color-border-secondary,#d0d0d0)" stroke-width="1.4"/>
  <text x="220" y="342" font-size="12.5" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">Any browser / user app</text>
  <text x="220" y="363" font-size="10.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">getAdminConfig returns only {coingeckoSet:true}</text>
  <text x="220" y="380" font-size="10.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">— a boolean, never the key value.</text>
  <text x="220" y="396" font-size="10" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">Direct Firestore read of config/app is denied by rules.</text>
  <line x1="618" y1="118" x2="404" y2="330" stroke="var(--color-text-primary,#b03030)" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#gx)"/>
  <text x="470" y="250" font-size="10" font-weight="700" fill="var(--color-text-primary,#b03030)">blocked</text>

  <text x="24" y="438" font-size="11" fill="var(--color-text-secondary,#6b6b6b)">Verified in the emulator: key stored ✓ · client sees set-flag only ✓ · header attached upstream ✓ · client read blocked by rules ✓</text>
  <text x="24" y="456" font-size="11" fill="var(--color-text-secondary,#6b6b6b)">Same model for PayPal secret + webhook id. Fallbacks: env vars / functions/.env (functions.config() removed in v7).</text>
</svg>