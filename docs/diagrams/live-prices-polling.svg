<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
  <title>Crypto Idea — live-prices polling (useLivePrices)</title>
  <desc>The app's useLivePrices hook seeds built-in mock prices on mount so numbers show instantly and offline (api="demo"), then every 60 seconds polls the same-origin /api/prices proxy for the currently held coins. The proxy serves fresh prices from the shared cache/universe doc and refetches only stale long-tail coins on demand; a scheduled refreshPrices job keeps the hot set fresh every 5 minutes. On the first live response the hook flips api to "live". Fetch errors return null so the last good prices are kept — never NaN. CoinGecko cost stays flat regardless of user count because the cache is shared.</desc>
  <defs>
    <marker id="lp_a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--color-text-secondary,#6b6b6b)"/></marker>
    <marker id="lp_d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--color-text-primary,#1a1a1a)"/></marker>
  </defs>
  <text x="24" y="28" font-size="19" font-weight="700" fill="var(--color-text-primary,#1a1a1a)">Live-Prices Polling — useLivePrices</text>
  <text x="24" y="47" font-size="12" fill="var(--color-text-secondary,#6b6b6b)">Seed mock instantly → poll the cached proxy every 60s for held coins → flip demo to live</text>
  <line x1="556" y1="26" x2="580" y2="26" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="2.5"/><text x="586" y="30" font-size="10.5" fill="var(--color-text-secondary,#6b6b6b)">app poll (per browser)</text>
  <line x1="730" y1="26" x2="754" y2="26" stroke="var(--color-text-primary,#1a1a1a)" stroke-width="2.5"/><text x="760" y="30" font-size="10.5" fill="var(--color-text-secondary,#6b6b6b)">scheduled / upstream</text>

  <!-- hook box -->
  <rect x="24" y="66" width="300" height="220" rx="10" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.7"/>
  <text x="40" y="88" font-size="12.5" font-weight="700" fill="var(--color-text-primary,#1a1a1a)">useLivePrices(portfolio)</text>
  <text x="40" y="105" font-size="9" fill="var(--color-text-secondary,#6b6b6b)">src/hooks/useLivePrices.js · returns {prices, api}</text>

  <rect x="40" y="118" width="268" height="58" rx="8" fill="var(--color-background-primary,#fff)" stroke="var(--color-border-secondary,#d0d0d0)" stroke-width="1.3"/>
  <text x="52" y="137" font-size="10.5" font-weight="700" fill="var(--color-text-primary,#1a1a1a)">1 · Seed on mount</text>
  <text x="52" y="153" font-size="9" fill="var(--color-text-secondary,#6b6b6b)">TOP_COINS mock prices → instant + offline</text>
  <text x="52" y="167" font-size="9" fill="var(--color-text-secondary,#6b6b6b)">api = "demo" (UI never empty)</text>

  <rect x="40" y="184" width="268" height="90" rx="8" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.4"/>
  <text x="52" y="203" font-size="10.5" font-weight="700" fill="var(--color-text-primary,#1a1a1a)">2 · Poll while holding coins</text>
  <text x="52" y="219" font-size="9" fill="var(--color-text-secondary,#6b6b6b)">ids = held coin ids · fetch now, then every 60s</text>
  <text x="52" y="233" font-size="9" fill="var(--color-text-secondary,#6b6b6b)">setInterval(60000) · cleared on unmount/change</text>
  <text x="52" y="251" font-size="9" fill="var(--color-text-secondary,#6b6b6b)">merge response → setPrices({...p, ...d})</text>
  <text x="52" y="265" font-size="9" fill="var(--color-text-secondary,#6b6b6b)">first live response → api = "live"</text>

  <!-- proxy -->
  <rect x="360" y="92" width="250" height="120" rx="10" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.6"/>
  <text x="485" y="113" font-size="11.5" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">/api/prices (same-origin proxy)</text>
  <text x="485" y="130" font-size="8.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">Cloud Function · holds the key server-side</text>
  <text x="485" y="150" font-size="9" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">per coin: fresh in cache (&lt; HOT_TTL)?</text>
  <text x="485" y="166" font-size="9" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">yes → serve from cache/universe</text>
  <text x="485" y="182" font-size="9" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">stale long-tail → refetch on demand,</text>
  <text x="485" y="196" font-size="9" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">fold back into the shared doc</text>
  <line x1="324" y1="150" x2="358" y2="150" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.5" marker-end="url(#lp_a)"/>
  <text x="332" y="143" font-size="8" fill="var(--color-text-secondary,#6b6b6b)">fetchPrices(ids)</text>

  <!-- cache doc -->
  <rect x="360" y="232" width="250" height="54" rx="9" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-primary,#1a1a1a)" stroke-width="1.5"/>
  <text x="485" y="254" font-size="10.5" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">cache/universe (one shared doc)</text>
  <text x="485" y="271" font-size="8.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">~3,000 coins: metadata + price · serves ALL users</text>
  <line x1="485" y1="212" x2="485" y2="230" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.3" marker-end="url(#lp_a)"/>

  <!-- refresh job -->
  <rect x="646" y="92" width="230" height="54" rx="9" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-primary,#1a1a1a)" stroke-width="1.6"/>
  <text x="761" y="114" font-size="10.5" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">refreshPrices — every 5 min</text>
  <text x="761" y="131" font-size="8.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">refreshes the HOT set (top ~1,250)</text>

  <!-- upstream -->
  <rect x="646" y="166" width="230" height="46" rx="9" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-primary,#1a1a1a)" stroke-width="1.6"/>
  <text x="761" y="194" font-size="11" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">CoinGecko (upstream)</text>
  <line x1="761" y1="146" x2="761" y2="164" stroke="var(--color-text-primary,#1a1a1a)" stroke-width="1.3" marker-end="url(#lp_d)"/>
  <line x1="646" y1="125" x2="612" y2="240" stroke="var(--color-text-primary,#1a1a1a)" stroke-width="1.3" marker-end="url(#lp_d)"/>
  <text x="636" y="200" font-size="8" text-anchor="end" fill="var(--color-text-secondary,#6b6b6b)">writes hot prices</text>
  <line x1="646" y1="189" x2="612" y2="150" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.2" stroke-dasharray="3 2" marker-end="url(#lp_a)"/>
  <text x="624" y="172" font-size="8" text-anchor="end" fill="var(--color-text-secondary,#6b6b6b)">on-demand tail</text>

  <!-- return path -->
  <rect x="24" y="300" width="300" height="40" rx="8" fill="var(--color-background-primary,#fff)" stroke="var(--color-border-secondary,#d0d0d0)" stroke-width="1.3"/>
  <text x="174" y="324" font-size="10" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">UI re-renders with merged {prices, api}</text>
  <line x1="360" y1="170" x2="326" y2="300" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.3" marker-end="url(#lp_a)"/>
  <text x="352" y="250" font-size="8" text-anchor="end" fill="var(--color-text-secondary,#6b6b6b)">JSON or null</text>

  <!-- notes -->
  <rect x="24" y="356" width="852" height="186" rx="10" fill="var(--color-background-primary,#fff)" stroke="var(--color-border-secondary,#d0d0d0)" stroke-width="1.3"/>
  <text x="40" y="378" font-size="11.5" font-weight="700" fill="var(--color-text-primary,#1a1a1a)">Why it's built this way</text>
  <text x="40" y="398" font-size="11" fill="var(--color-text-secondary,#6b6b6b)">• Instant + offline: seeding mock prices means the portfolio is never blank while the first request is in flight, and it still shows numbers offline.</text>
  <text x="40" y="416" font-size="11" fill="var(--color-text-secondary,#6b6b6b)">• Degrade, never break: fetchPrices returns null on any error → the hook keeps the last good prices (stays on "demo"/last) — no NaN, no crash, never throws.</text>
  <text x="40" y="434" font-size="11" fill="var(--color-text-secondary,#6b6b6b)">• Only held coins polled: ids = the active portfolio's coins, so each browser fetches a tiny payload; the interval is cleared when the portfolio changes/unmounts.</text>
  <text x="40" y="452" font-size="11" fill="var(--color-text-secondary,#6b6b6b)">• Flat upstream cost: every browser hits the SAME cached proxy + shared cache/universe doc, so CoinGecko calls don't scale with users (1k or 10k → same).</text>
  <text x="40" y="470" font-size="11" fill="var(--color-text-secondary,#6b6b6b)">• 60s poll vs 5-min refresh: the UI asks every 60s, but the hot set only changes every ~5 min — most polls are cache hits; the long tail is refreshed on demand.</text>
  <text x="40" y="488" font-size="11" fill="var(--color-text-secondary,#6b6b6b)">• No key in the browser: the same-origin /api proxy attaches the CoinGecko key server-side — the client never sees it.</text>
  <text x="40" y="514" font-size="9" fill="var(--color-text-secondary,#6b6b6b)">Source: src/hooks/useLivePrices.js · src/api/coingecko.js (fetchPrices) · functions/index.js (/api/prices, refreshPrices, HOT_TTL/HOT_PAGES, cache/universe)</text>
  <text x="40" y="530" font-size="9" fill="var(--color-text-secondary,#6b6b6b)">Related: coin-data-flow.svg (the hot/tail hybrid + refresh jobs in full) · api-key-flow.svg (how the key reaches upstream).</text>
</svg>
