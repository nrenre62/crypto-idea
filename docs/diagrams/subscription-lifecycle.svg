<svg role="img" viewBox="0 0 760 500" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,sans-serif">
  <title>Subscription lifecycle — checkout, webhook, period-end sweep, re-checkout</title>
  <desc>The guarded createSubscription checkout, the idempotent plan-aware PayPal webhook that never drops a tier immediately, the daily period-end sweep, and the R29 Premium-to-Pro re-checkout fork.</desc>
  <defs>
    <marker id="s1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8z" fill="var(--color-text-secondary, #6b6b6b)"/></marker>
  </defs>
  <text x="20" y="26" font-size="15" font-weight="700" fill="var(--color-text-primary, #1a1a1a)">Subscription lifecycle (BL-1 + R29) — a paid tier always has a payment behind it</text>

  <rect x="20" y="46" width="170" height="66" rx="8" fill="var(--color-background-primary, #fff)" stroke="var(--color-border-secondary, #d0d0d0)"/>
  <text x="105" y="66" font-size="12" font-weight="600" text-anchor="middle" fill="var(--color-text-primary, #1a1a1a)">createSubscription</text>
  <text x="105" y="82" font-size="9.5" text-anchor="middle" fill="var(--color-text-secondary, #6b6b6b)">already-paid guard · 60s cooldown</text>
  <text x="105" y="96" font-size="9.5" text-anchor="middle" fill="var(--color-text-secondary, #6b6b6b)">billingCycle persisted (D6)</text>

  <rect x="240" y="46" width="140" height="66" rx="8" fill="var(--color-background-primary, #fff)" stroke="var(--color-text-primary, #1a1a1a)" stroke-width="1.6"/>
  <text x="310" y="72" font-size="12" font-weight="600" text-anchor="middle" fill="var(--color-text-primary, #1a1a1a)">PayPal approve</text>
  <text x="310" y="90" font-size="9.5" text-anchor="middle" fill="var(--color-text-secondary, #6b6b6b)">external checkout</text>

  <rect x="430" y="46" width="310" height="66" rx="8" fill="var(--color-background-primary, #fff)" stroke="var(--color-text-primary, #1a1a1a)" stroke-width="1.6"/>
  <text x="585" y="64" font-size="12" font-weight="600" text-anchor="middle" fill="var(--color-text-primary, #1a1a1a)">paypalWebhook — verified + IDEMPOTENT</text>
  <text x="585" y="80" font-size="9.5" text-anchor="middle" fill="var(--color-text-secondary, #6b6b6b)">signature check → webhookEvents/{event.id} processed ONCE</text>
  <text x="585" y="94" font-size="9.5" text-anchor="middle" fill="var(--color-text-secondary, #6b6b6b)">pure decisions in billing.js (22 unit tests)</text>

  <line x1="190" y1="79" x2="238" y2="79" stroke="var(--color-text-secondary, #6b6b6b)" marker-end="url(#s1)"/>
  <line x1="380" y1="79" x2="428" y2="79" stroke="var(--color-text-secondary, #6b6b6b)" marker-end="url(#s1)"/>

  <rect x="20" y="150" width="225" height="72" rx="8" fill="var(--color-background-primary, #fff)" stroke="var(--color-border-secondary, #d0d0d0)"/>
  <text x="132" y="170" font-size="11" font-weight="600" text-anchor="middle" fill="var(--color-text-primary, #1a1a1a)">ACTIVATED → plan_id → tier</text>
  <text x="132" y="186" font-size="9.5" text-anchor="middle" fill="var(--color-text-secondary, #6b6b6b)">Premium plan lands as premium (B8 fix)</text>
  <text x="132" y="200" font-size="9.5" text-anchor="middle" fill="var(--color-text-secondary, #6b6b6b)">unknown plan → tier untouched + warn</text>

  <rect x="267" y="150" width="225" height="72" rx="8" fill="var(--color-background-primary, #fff)" stroke="var(--color-border-secondary, #d0d0d0)"/>
  <text x="379" y="170" font-size="11" font-weight="600" text-anchor="middle" fill="var(--color-text-primary, #1a1a1a)">SALE.COMPLETED → lastPayment</text>
  <text x="379" y="186" font-size="9.5" text-anchor="middle" fill="var(--color-text-secondary, #6b6b6b)">never sets a tier blindly — only restores</text>
  <text x="379" y="200" font-size="9.5" text-anchor="middle" fill="var(--color-text-secondary, #6b6b6b)">tierBeforeFailure on a recovered account</text>

  <rect x="514" y="150" width="226" height="72" rx="8" fill="var(--color-background-primary, #fff)" stroke="var(--color-border-secondary, #d0d0d0)"/>
  <text x="627" y="170" font-size="11" font-weight="600" text-anchor="middle" fill="var(--color-text-primary, #1a1a1a)">CANCELLED / SUSPENDED → marker</text>
  <text x="627" y="186" font-size="9.5" text-anchor="middle" fill="var(--color-text-secondary, #6b6b6b)">NO instant tier drop — access runs to</text>
  <text x="627" y="200" font-size="9.5" text-anchor="middle" fill="var(--color-text-secondary, #6b6b6b)">endDate (= next_billing_time)</text>

  <line x1="500" y1="112" x2="140" y2="148" stroke="var(--color-text-secondary, #6b6b6b)" marker-end="url(#s1)"/>
  <line x1="570" y1="112" x2="390" y2="148" stroke="var(--color-text-secondary, #6b6b6b)" marker-end="url(#s1)"/>
  <line x1="640" y1="112" x2="630" y2="148" stroke="var(--color-text-secondary, #6b6b6b)" marker-end="url(#s1)"/>

  <rect x="20" y="262" width="720" height="70" rx="8" fill="var(--color-background-primary, #fff)" stroke="var(--color-border-secondary, #d0d0d0)"/>
  <text x="380" y="284" font-size="12" font-weight="600" text-anchor="middle" fill="var(--color-text-primary, #1a1a1a)">enforceSubscriptionPeriods — the DAILY server-side flip</text>
  <text x="380" y="302" font-size="10" text-anchor="middle" fill="var(--color-text-secondary, #6b6b6b)">cancelled + endDate passed → tier = free (target "free" clears the marker · target "pro" KEEPS it → the R29 re-checkout decides)</text>
  <text x="380" y="318" font-size="10" text-anchor="middle" fill="var(--color-text-secondary, #6b6b6b)">paymentFailed + 7-day grace elapsed → tier = free (tierBeforeFailure kept for SALE.COMPLETED recovery)</text>
  <line x1="627" y1="222" x2="627" y2="260" stroke="var(--color-text-secondary, #6b6b6b)" marker-end="url(#s1)"/>

  <rect x="20" y="368" width="350" height="76" rx="8" fill="var(--color-background-primary, #fff)" stroke="var(--color-border-secondary, #d0d0d0)"/>
  <text x="195" y="388" font-size="11" font-weight="600" text-anchor="middle" fill="var(--color-text-primary, #1a1a1a)">R29 re-checkout (app, forced choice — no X)</text>
  <text x="195" y="405" font-size="9.5" text-anchor="middle" fill="var(--color-text-secondary, #6b6b6b)">"Approve Pro payment" → the REAL Pro checkout → ACTIVATED</text>
  <text x="195" y="419" font-size="9.5" text-anchor="middle" fill="var(--color-text-secondary, #6b6b6b)">"Continue with Starter" → marker cleared</text>
  <text x="195" y="433" font-size="9.5" text-anchor="middle" fill="var(--color-text-secondary, #6b6b6b)">data trim DEFERRED until this decision</text>

  <rect x="400" y="368" width="340" height="76" rx="8" fill="var(--color-background-primary, #fff)" stroke="var(--color-border-secondary, #d0d0d0)"/>
  <text x="570" y="388" font-size="11" font-weight="600" text-anchor="middle" fill="var(--color-text-primary, #1a1a1a)">Trust boundary (rules)</text>
  <text x="570" y="405" font-size="9.5" text-anchor="middle" fill="var(--color-text-secondary, #6b6b6b)">subscription · billingCycle · tierBeforeFailure · paypalSubscriptionId</text>
  <text x="570" y="419" font-size="9.5" text-anchor="middle" fill="var(--color-text-secondary, #6b6b6b)">are OWNER-IMMUTABLE (update + create) — a user can't clear</text>
  <text x="570" y="433" font-size="9.5" text-anchor="middle" fill="var(--color-text-secondary, #6b6b6b)">their own cancellation or hijack payment recovery</text>

  <line x1="195" y1="332" x2="195" y2="366" stroke="var(--color-text-secondary, #6b6b6b)" marker-end="url(#s1)"/>

  <text x="20" y="478" font-size="10" fill="var(--color-text-secondary, #6b6b6b)">Legend: grey = app/server flow · dark border = PayPal/external. Go-live remainder: reactivate/resolve callables so client decisions clear the server marker (§BL-4).</text>
</svg>
