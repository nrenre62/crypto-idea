<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
  <title>5 agents on one project — isolation &amp; merge workflow</title>
  <desc>Each agent works in its own git worktree (a separate folder on its own branch), in a non-overlapping lane of the codebase. All worktrees share one .git and integrate into master via review. The local dev/emulator stack is a single shared instance used one agent at a time.</desc>
  <defs>
    <marker id="mw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--color-text-secondary,#6b6b6b)"/></marker>
  </defs>
  <text x="24" y="30" font-size="19" font-weight="700" fill="var(--color-text-primary,#1a1a1a)">5 Agents, One Project — Safe Setup</text>
  <text x="24" y="50" font-size="12.5" fill="var(--color-text-secondary,#6b6b6b)">Isolate edits (worktrees + lanes) · integrate via master · share the dev stack one-at-a-time</text>
  <g>
    <rect x="24" y="70" width="166" height="116" rx="9" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-info,#2c7fb8)" stroke-width="1.7"/>
    <text x="107" y="91" font-size="13" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">Agent 1</text>
    <text x="107" y="110" font-size="10.5" text-anchor="middle" fill="var(--color-text-info,#2c7fb8)">lane: backend</text>
    <text x="107" y="128" font-size="9.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">functions/</text>
    <text x="107" y="150" font-size="9.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">dir: ../ci-a1</text>
    <text x="107" y="166" font-size="9.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">branch: a1/backend</text>
    <rect x="200" y="70" width="166" height="116" rx="9" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-info,#2c7fb8)" stroke-width="1.7"/>
    <text x="283" y="91" font-size="13" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">Agent 2</text>
    <text x="283" y="110" font-size="10.5" text-anchor="middle" fill="var(--color-text-info,#2c7fb8)">lane: landing</text>
    <text x="283" y="128" font-size="9.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">index.html (+ DCA)</text>
    <text x="283" y="150" font-size="9.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">dir: ../ci-a2</text>
    <text x="283" y="166" font-size="9.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">branch: a2/landing</text>
    <rect x="376" y="70" width="166" height="116" rx="9" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-info,#2c7fb8)" stroke-width="1.7"/>
    <text x="459" y="91" font-size="13" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">Agent 3</text>
    <text x="459" y="110" font-size="10.5" text-anchor="middle" fill="var(--color-text-info,#2c7fb8)">lane: admin</text>
    <text x="459" y="128" font-size="9.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">admin.html + dash</text>
    <text x="459" y="150" font-size="9.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">dir: ../ci-a3</text>
    <text x="459" y="166" font-size="9.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">branch: a3/admin</text>
    <rect x="552" y="70" width="166" height="116" rx="9" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-info,#2c7fb8)" stroke-width="1.7"/>
    <text x="635" y="91" font-size="13" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">Agent 4</text>
    <text x="635" y="110" font-size="10.5" text-anchor="middle" fill="var(--color-text-info,#2c7fb8)">lane: user app</text>
    <text x="635" y="128" font-size="9.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">src/components, hooks</text>
    <text x="635" y="150" font-size="9.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">dir: ../ci-a4</text>
    <text x="635" y="166" font-size="9.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">branch: a4/app</text>
    <rect x="728" y="70" width="148" height="116" rx="9" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-info,#2c7fb8)" stroke-width="1.7"/>
    <text x="802" y="91" font-size="13" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">Agent 5</text>
    <text x="802" y="110" font-size="10.5" text-anchor="middle" fill="var(--color-text-info,#2c7fb8)">lane: tests+docs</text>
    <text x="802" y="128" font-size="9.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">tests/, docs/</text>
    <text x="802" y="150" font-size="9.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">dir: ../ci-a5</text>
    <text x="802" y="166" font-size="9.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">branch: a5/tests</text>
  </g>
  <line x1="107" y1="186" x2="107" y2="232" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.5" marker-end="url(#mw)"/>
  <line x1="283" y1="186" x2="283" y2="232" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.5" marker-end="url(#mw)"/>
  <line x1="459" y1="186" x2="459" y2="232" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.5" marker-end="url(#mw)"/>
  <line x1="635" y1="186" x2="635" y2="232" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.5" marker-end="url(#mw)"/>
  <line x1="802" y1="186" x2="802" y2="232" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.5" marker-end="url(#mw)"/>
  <rect x="24" y="234" width="852" height="58" rx="10" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-primary,#1a1a1a)" stroke-width="1.8"/>
  <text x="450" y="258" font-size="13" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">ONE shared .git  →  master</text>
  <text x="450" y="278" font-size="10.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">each branch merged in after review · rebase on master often · never 5 agents committing to master at once</text>
  <rect x="24" y="320" width="420" height="118" rx="10" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.5"/>
  <text x="234" y="343" font-size="12.5" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">! Local dev stack = ONE shared instance</text>
  <text x="234" y="364" font-size="10.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">ports 3000 / 4000 / 5001 / 8080 / 8085 / 9099</text>
  <text x="234" y="382" font-size="10.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">only ONE agent runs `npm run start:all` at a time</text>
  <text x="234" y="400" font-size="10.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">(or port-shift per worktree — heavy: 5x JVM)</text>
  <text x="234" y="421" font-size="10" text-anchor="middle" fill="var(--color-text-info,#2c7fb8)">in-memory Firestore is shared → don't seed/reset concurrently</text>
  <rect x="456" y="320" width="420" height="118" rx="10" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.5"/>
  <text x="666" y="343" font-size="12.5" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">+ Most work needs NO stack</text>
  <text x="666" y="364" font-size="10.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">editing code · `npm run test:unit` (vitest)</text>
  <text x="666" y="382" font-size="10.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">`npm run build` · writing docs/diagrams</text>
  <text x="666" y="403" font-size="10.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">→ all 5 run these in parallel, no collision</text>
  <text x="666" y="423" font-size="10" text-anchor="middle" fill="var(--color-text-info,#2c7fb8)">only rules/integration tests + live verify need the stack</text>
  <text x="24" y="466" font-size="11.5" font-weight="700" fill="var(--color-text-primary,#1a1a1a)">Shared by all (good):</text>
  <text x="150" y="466" font-size="11.5" fill="var(--color-text-secondary,#6b6b6b)">CLAUDE.md, NEXT-STEPS.md (lane assignments), memory, the git history.</text>
  <text x="24" y="486" font-size="11.5" font-weight="700" fill="var(--color-text-primary,#1a1a1a)">Per worktree:</text>
  <text x="150" y="486" font-size="11.5" fill="var(--color-text-secondary,#6b6b6b)">its own node_modules (+ functions/node_modules) — run npm install once each.</text>
  <text x="24" y="506" font-size="11.5" font-weight="700" fill="var(--color-text-primary,#1a1a1a)">Golden rule:</text>
  <text x="150" y="506" font-size="11.5" fill="var(--color-text-secondary,#6b6b6b)">two agents must never edit the same file at once — partition into lanes first.</text>
</svg>