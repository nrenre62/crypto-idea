<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
  <title>Crypto Idea — PayPal subscription &amp; webhook flow</title>
  <desc>A signed-in user starts a subscription via createSubscription (acting on their own uid), approves it on PayPal, and PayPal posts webhook events. paypalWebhook verifies every event's signature before updating the user's tier in Firestore; unverified events are rejected. Cancellation acts on the caller's own subscription.</desc>
  <defs>
    <marker id="pp_a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--color-text-secondary,#6b6b6b)"/></marker>
  </defs>
  <text x="24" y="28" font-size="19" font-weight="700" fill="var(--color-text-primary,#1a1a1a)">PayPal Subscription &amp; Webhook Flow</text>
  <text x="24" y="47" font-size="12" fill="var(--color-text-secondary,#6b6b6b)">Callables act on the caller's own uid (no IDOR) · every webhook event is signature-verified before changing a tier</text>
  <line x1="610" y1="26" x2="634" y2="26" stroke="var(--color-text-info,#2c7fb8)" stroke-width="2.5"/><text x="640" y="30" font-size="10.5" fill="var(--color-text-secondary,#6b6b6b)">our app/functions</text>
  <line x1="775" y1="26" x2="799" y2="26" stroke="var(--color-text-primary,#1a1a1a)" stroke-width="2.5"/><text x="805" y="30" font-size="10.5" fill="var(--color-text-secondary,#6b6b6b)">PayPal/DB</text>
  <text x="24" y="68" font-size="11" font-weight="700" fill="var(--color-text-secondary,#6b6b6b)">Subscribe</text>
  <rect x="24" y="74" width="116" height="46" rx="8" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-info,#2c7fb8)" stroke-width="1.6"/>
  <text x="82" y="101" font-size="11" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">User App</text>
  <rect x="156" y="74" width="176" height="46" rx="8" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-info,#2c7fb8)" stroke-width="1.6"/>
  <text x="244" y="95" font-size="11" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">createSubscription</text>
  <text x="244" y="110" font-size="8.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">callable · uid from token</text>
  <rect x="348" y="74" width="160" height="46" rx="8" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-primary,#1a1a1a)" stroke-width="1.6"/>
  <text x="428" y="95" font-size="11" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">PayPal: create sub</text>
  <text x="428" y="110" font-size="8.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">plan_id (env) · custom_id=uid</text>
  <rect x="524" y="74" width="164" height="46" rx="8" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-primary,#1a1a1a)" stroke-width="1.6"/>
  <text x="606" y="95" font-size="11" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">User approves</text>
  <text x="606" y="110" font-size="8.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">via approvalUrl @ PayPal</text>
  <rect x="704" y="74" width="172" height="46" rx="8" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-info,#2c7fb8)" stroke-width="1.6"/>
  <text x="790" y="101" font-size="11" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">redirect /pro-success</text>
  <line x1="140" y1="97" x2="154" y2="97" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.4" marker-end="url(#pp_a)"/>
  <line x1="332" y1="97" x2="346" y2="97" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.4" marker-end="url(#pp_a)"/>
  <line x1="508" y1="97" x2="522" y2="97" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.4" marker-end="url(#pp_a)"/>
  <line x1="688" y1="97" x2="702" y2="97" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.4" marker-end="url(#pp_a)"/>
  <text x="24" y="160" font-size="11" font-weight="700" fill="var(--color-text-secondary,#6b6b6b)">Activation (webhook → tier)</text>
  <rect x="24" y="166" width="160" height="56" rx="8" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-primary,#1a1a1a)" stroke-width="1.6"/>
  <text x="104" y="187" font-size="11" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">PayPal sends event</text>
  <text x="104" y="201" font-size="8" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">ACTIVATED · PAYMENT.SALE</text>
  <text x="104" y="213" font-size="8" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">CANCELLED · SUSPENDED</text>
  <rect x="200" y="166" width="150" height="56" rx="8" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-info,#2c7fb8)" stroke-width="1.6"/>
  <text x="275" y="190" font-size="11" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">paypalWebhook</text>
  <text x="275" y="205" font-size="8.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">public endpoint</text>
  <rect x="366" y="166" width="190" height="56" rx="8" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-info,#2c7fb8)" stroke-width="1.6"/>
  <text x="461" y="190" font-size="11" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">verify signature</text>
  <text x="461" y="205" font-size="8.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">PayPal verify-webhook-sig · fail closed</text>
  <rect x="572" y="166" width="304" height="56" rx="8" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-primary,#1a1a1a)" stroke-width="1.6"/>
  <text x="724" y="187" font-size="11" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">Firestore users/{uid}.tier</text>
  <text x="724" y="201" font-size="8" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">ACTIVATED → pro + subId · SALE → pro, lastPayment</text>
  <text x="724" y="213" font-size="8" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">CANCELLED / SUSPENDED → free</text>
  <line x1="184" y1="194" x2="198" y2="194" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.4" marker-end="url(#pp_a)"/>
  <line x1="350" y1="194" x2="364" y2="194" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.4" marker-end="url(#pp_a)"/>
  <line x1="556" y1="194" x2="570" y2="194" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.4" marker-end="url(#pp_a)"/>
  <text x="563" y="188" font-size="8" fill="var(--color-text-info,#2c7fb8)">verified</text>
  <rect x="366" y="236" width="190" height="28" rx="7" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-primary,#1a1a1a)" stroke-width="1.4"/>
  <text x="461" y="254" font-size="10" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">✗ 401 — signature invalid</text>
  <line x1="461" y1="222" x2="461" y2="234" stroke="var(--color-text-primary,#1a1a1a)" stroke-width="1.3" stroke-dasharray="3 2" marker-end="url(#pp_a)"/>
  <text x="24" y="296" font-size="11" font-weight="700" fill="var(--color-text-secondary,#6b6b6b)">Cancel</text>
  <rect x="24" y="302" width="116" height="42" rx="8" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-info,#2c7fb8)" stroke-width="1.6"/>
  <text x="82" y="327" font-size="11" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">User App</text>
  <rect x="156" y="302" width="176" height="42" rx="8" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-info,#2c7fb8)" stroke-width="1.6"/>
  <text x="244" y="320" font-size="11" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">cancelSubscription</text>
  <text x="244" y="334" font-size="8.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">callable · own uid only</text>
  <rect x="348" y="302" width="150" height="42" rx="8" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-primary,#1a1a1a)" stroke-width="1.6"/>
  <text x="423" y="327" font-size="11" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">PayPal cancel</text>
  <rect x="514" y="302" width="200" height="42" rx="8" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-primary,#1a1a1a)" stroke-width="1.6"/>
  <text x="614" y="327" font-size="11" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">Firestore tier = free</text>
  <line x1="140" y1="323" x2="154" y2="323" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.4" marker-end="url(#pp_a)"/>
  <line x1="332" y1="323" x2="346" y2="323" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.4" marker-end="url(#pp_a)"/>
  <line x1="498" y1="323" x2="512" y2="323" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.4" marker-end="url(#pp_a)"/>
  <rect x="24" y="360" width="852" height="124" rx="10" fill="var(--color-background-primary,#fff)" stroke="var(--color-border-secondary,#d0d0d0)" stroke-width="1.3"/>
  <text x="40" y="382" font-size="11.5" font-weight="700" fill="var(--color-text-primary,#1a1a1a)">Security notes</text>
  <text x="40" y="402" font-size="11" fill="var(--color-text-secondary,#6b6b6b)">• createSubscription / cancelSubscription act on context.auth.uid — never a uid from the request body (no IDOR).</text>
  <text x="40" y="420" font-size="11" fill="var(--color-text-secondary,#6b6b6b)">• paypalWebhook is public, but EVERY event is verified via PayPal's verify-webhook-signature API before any tier change; unverified → 401.</text>
  <text x="40" y="438" font-size="11" fill="var(--color-text-secondary,#6b6b6b)">• Fails closed: if the webhook id isn't configured, verification returns false and the event is rejected.</text>
  <text x="40" y="456" font-size="11" fill="var(--color-text-secondary,#6b6b6b)">• PayPal client id / secret / webhook id live server-side (config/app or env); plan IDs are env-only. return_url is fixed (no open redirect).</text>
  <text x="40" y="474" font-size="9" fill="var(--color-text-secondary,#6b6b6b)">Source: functions/index.js — createSubscription, cancelSubscription, paypalWebhook, verifyPayPalWebhook</text>
</svg>