<svg role="img" viewBox="0 0 760 430" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,sans-serif">
  <title>Conviction engine — evidence to signal pills</title>
  <desc>Holdings with journals feed deterministic mock evidence into the pure rubric reducer, which grades the four-state conviction pills on Research coin cards; the Wave-B target swaps the mock seam for a validated shared conviction cache.</desc>
  <defs>
    <marker id="c1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8z" fill="var(--color-text-secondary, #6b6b6b)"/></marker>
  </defs>
  <text x="20" y="28" font-size="15" font-weight="700" fill="var(--color-text-primary, #1a1a1a)">Conviction engine — evidence → rubric → pills</text>

  <rect x="20" y="52" width="160" height="64" rx="8" fill="var(--color-background-primary, #fff)" stroke="var(--color-border-secondary, #d0d0d0)"/>
  <text x="100" y="78" font-size="12" font-weight="600" text-anchor="middle" fill="var(--color-text-primary, #1a1a1a)">Active holdings</text>
  <text x="100" y="96" font-size="10" text-anchor="middle" fill="var(--color-text-secondary, #6b6b6b)">entries + journal carried</text>

  <rect x="210" y="52" width="160" height="64" rx="8" fill="var(--color-background-primary, #fff)" stroke="var(--color-border-secondary, #d0d0d0)"/>
  <text x="290" y="72" font-size="12" font-weight="600" text-anchor="middle" fill="var(--color-text-primary, #1a1a1a)">mock-conviction.js</text>
  <text x="290" y="88" font-size="10" text-anchor="middle" fill="var(--color-text-secondary, #6b6b6b)">deterministic evidence</text>
  <text x="290" y="102" font-size="10" text-anchor="middle" fill="var(--color-text-secondary, #6b6b6b)">asOf = yesterday (derived)</text>

  <rect x="400" y="52" width="160" height="64" rx="8" fill="var(--color-background-primary, #fff)" stroke="var(--color-border-secondary, #d0d0d0)"/>
  <text x="480" y="72" font-size="12" font-weight="600" text-anchor="middle" fill="var(--color-text-primary, #1a1a1a)">conviction.js reducer</text>
  <text x="480" y="88" font-size="10" text-anchor="middle" fill="var(--color-text-secondary, #6b6b6b)">pure · unit-tested</text>
  <text x="480" y="102" font-size="10" text-anchor="middle" fill="var(--color-text-secondary, #6b6b6b)">reduceAxis · catalysts</text>

  <rect x="590" y="52" width="150" height="64" rx="8" fill="var(--color-background-primary, #fff)" stroke="var(--color-border-secondary, #d0d0d0)"/>
  <text x="665" y="72" font-size="12" font-weight="600" text-anchor="middle" fill="var(--color-text-primary, #1a1a1a)">CoinCard pills</text>
  <text x="665" y="88" font-size="10" text-anchor="middle" fill="var(--color-text-secondary, #6b6b6b)">🟢 🟡 🔴 ⬛ + reason chip</text>
  <text x="665" y="102" font-size="10" text-anchor="middle" fill="var(--color-text-secondary, #6b6b6b)">funnel bridge note</text>

  <line x1="180" y1="84" x2="208" y2="84" stroke="var(--color-text-secondary, #6b6b6b)" marker-end="url(#c1)"/>
  <line x1="370" y1="84" x2="398" y2="84" stroke="var(--color-text-secondary, #6b6b6b)" marker-end="url(#c1)"/>
  <line x1="560" y1="84" x2="588" y2="84" stroke="var(--color-text-secondary, #6b6b6b)" marker-end="url(#c1)"/>

  <text x="30" y="150" font-size="11" font-weight="600" fill="var(--color-text-primary, #1a1a1a)">The rubric (#8/#9/#11):</text>
  <text x="30" y="168" font-size="10" fill="var(--color-text-secondary, #6b6b6b)">• fewer than 2 corroborating sources → ⬛ with a reason chip (no public repo / no coverage / anonymous team) — ⬛ is a finding, never a blank</text>
  <text x="30" y="184" font-size="10" fill="var(--color-text-secondary, #6b6b6b)">• all good → 🟢 · any conflict or mixed → 🟡 · corroborated-bad or dead → 🔴 · catalysts auto-expire past their date · every grade stamped "as of DATE"</text>

  <rect x="20" y="210" width="720" height="150" rx="10" fill="none" stroke="var(--color-text-primary, #1a1a1a)" stroke-dasharray="6 4"/>
  <text x="36" y="234" font-size="12" font-weight="700" fill="var(--color-text-primary, #1a1a1a)">Wave B — TARGET (not built): the mock seam swaps for the live engine</text>

  <rect x="36" y="250" width="160" height="58" rx="8" fill="var(--color-background-primary, #fff)" stroke="var(--color-text-primary, #1a1a1a)"/>
  <text x="116" y="272" font-size="11" font-weight="600" text-anchor="middle" fill="var(--color-text-primary, #1a1a1a)">Fetchers (B5)</text>
  <text x="116" y="288" font-size="9.5" text-anchor="middle" fill="var(--color-text-secondary, #6b6b6b)">GitHub · news allowlist · CG</text>

  <rect x="226" y="250" width="160" height="58" rx="8" fill="var(--color-background-primary, #fff)" stroke="var(--color-text-primary, #1a1a1a)"/>
  <text x="306" y="272" font-size="11" font-weight="600" text-anchor="middle" fill="var(--color-text-primary, #1a1a1a)">Claude + validateOutput</text>
  <text x="306" y="288" font-size="9.5" text-anchor="middle" fill="var(--color-text-secondary, #6b6b6b)">fail-closed · N=2 regen cap</text>

  <rect x="416" y="250" width="170" height="58" rx="8" fill="var(--color-background-primary, #fff)" stroke="var(--color-text-primary, #1a1a1a)"/>
  <text x="501" y="272" font-size="11" font-weight="600" text-anchor="middle" fill="var(--color-text-primary, #1a1a1a)">convictionCache/{coinId}</text>
  <text x="501" y="288" font-size="9.5" text-anchor="middle" fill="var(--color-text-secondary, #6b6b6b)">shared · server-write-only</text>

  <rect x="616" y="250" width="112" height="58" rx="8" fill="var(--color-background-primary, #fff)" stroke="var(--color-text-primary, #1a1a1a)"/>
  <text x="672" y="272" font-size="11" font-weight="600" text-anchor="middle" fill="var(--color-text-primary, #1a1a1a)">getConviction</text>
  <text x="672" y="288" font-size="9.5" text-anchor="middle" fill="var(--color-text-secondary, #6b6b6b)">→ replaces the mock</text>

  <line x1="196" y1="279" x2="224" y2="279" stroke="var(--color-text-secondary, #6b6b6b)" marker-end="url(#c1)"/>
  <line x1="386" y1="279" x2="414" y2="279" stroke="var(--color-text-secondary, #6b6b6b)" marker-end="url(#c1)"/>
  <line x1="586" y1="279" x2="614" y2="279" stroke="var(--color-text-secondary, #6b6b6b)" marker-end="url(#c1)"/>

  <text x="36" y="330" font-size="10" fill="var(--color-text-secondary, #6b6b6b)">On-demand only, no scheduler · read-time TTL: Premium 24h · Pro 48h · Starter read-only (cache or ⬛) · budget = the shared per-uid daily counter (guards.js)</text>
  <text x="36" y="346" font-size="10" fill="var(--color-text-secondary, #6b6b6b)">Generated ONCE per coin, amortized across all users — never per-user generation. The LLM never web-searches; fetchers supply the evidence.</text>

  <text x="20" y="400" font-size="10" fill="var(--color-text-secondary, #6b6b6b)">Legend: solid grey = implemented (mock-fed) · dashed dark = Wave-B target · the reducer + pills are LIVE code either way — only the evidence source swaps.</text>
</svg>
