<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
  <title>Crypto Idea — auth &amp; session flow</title>
  <desc>Register/login/logout/reset go through Firebase Authentication, which holds the password and is the source of truth. Register also creates the Firestore user profile and default portfolio. onAuthChange drives the session: on sign-in it loads the server-authoritative tier and portfolios and shows the app; on sign-out it shows login. Admin is a verified custom claim.</desc>
  <defs>
    <marker id="as_a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--color-text-secondary,#6b6b6b)"/></marker>
  </defs>
  <text x="24" y="30" font-size="19" font-weight="700" fill="var(--color-text-primary,#1a1a1a)">Auth &amp; Session Flow</text>
  <text x="24" y="50" font-size="12.5" fill="var(--color-text-secondary,#6b6b6b)">Password lives in Firebase Auth only (never on device) · tier is server-authoritative · admin = a verified custom claim</text>
  <line x1="610" y1="26" x2="634" y2="26" stroke="var(--color-text-info,#2c7fb8)" stroke-width="2.5"/><text x="640" y="30" font-size="11" fill="var(--color-text-secondary,#6b6b6b)">user action</text>
  <line x1="730" y1="26" x2="754" y2="26" stroke="var(--color-text-primary,#1a1a1a)" stroke-width="2.5"/><text x="760" y="30" font-size="11" fill="var(--color-text-secondary,#6b6b6b)">Firebase</text>
  <rect x="24" y="66" width="176" height="46" rx="8" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-info,#2c7fb8)" stroke-width="1.6"/>
  <text x="112" y="85" font-size="12" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">registerUser</text>
  <text x="112" y="101" font-size="9.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">email · pw · name</text>
  <rect x="212" y="66" width="150" height="46" rx="8" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-info,#2c7fb8)" stroke-width="1.6"/>
  <text x="287" y="85" font-size="12" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">loginUser</text>
  <text x="287" y="101" font-size="9.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">+ lastLogin</text>
  <rect x="374" y="66" width="130" height="46" rx="8" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-info,#2c7fb8)" stroke-width="1.6"/>
  <text x="439" y="85" font-size="12" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">logoutUser</text>
  <text x="439" y="101" font-size="9.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">signOut</text>
  <rect x="516" y="66" width="160" height="46" rx="8" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-info,#2c7fb8)" stroke-width="1.6"/>
  <text x="596" y="85" font-size="12" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">resetPassword</text>
  <text x="596" y="101" font-size="9.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">email link</text>
  <rect x="150" y="150" width="430" height="58" rx="10" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-primary,#1a1a1a)" stroke-width="2"/>
  <text x="365" y="174" font-size="13.5" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">Firebase Authentication</text>
  <text x="365" y="194" font-size="10.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">holds the password · source of truth for "who is signed in"</text>
  <line x1="112" y1="112" x2="200" y2="148" stroke="var(--color-text-info,#2c7fb8)" stroke-width="1.5" marker-end="url(#as_a)"/>
  <line x1="287" y1="112" x2="320" y2="148" stroke="var(--color-text-info,#2c7fb8)" stroke-width="1.5" marker-end="url(#as_a)"/>
  <line x1="439" y1="112" x2="430" y2="148" stroke="var(--color-text-info,#2c7fb8)" stroke-width="1.5" marker-end="url(#as_a)"/>
  <line x1="596" y1="112" x2="520" y2="148" stroke="var(--color-text-info,#2c7fb8)" stroke-width="1.5" marker-end="url(#as_a)"/>
  <rect x="624" y="146" width="252" height="66" rx="10" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-primary,#1a1a1a)" stroke-width="1.6"/>
  <text x="750" y="167" font-size="11.5" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">Firestore (on register)</text>
  <text x="750" y="184" font-size="9.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">users/{uid}: tier=free, counters=0</text>
  <text x="750" y="198" font-size="9.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">+ default portfolio (writeBatch → count=1)</text>
  <line x1="200" y1="80" x2="624" y2="158" stroke="var(--color-text-info,#2c7fb8)" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#as_a)"/>
  <rect x="150" y="248" width="430" height="54" rx="10" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.7"/>
  <text x="365" y="270" font-size="12.5" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">onAuthChange → useAuthSession (subscribed once)</text>
  <text x="365" y="289" font-size="10" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">fires on every sign-in / sign-out</text>
  <line x1="365" y1="208" x2="365" y2="246" stroke="var(--color-text-primary,#1a1a1a)" stroke-width="1.6" marker-end="url(#as_a)"/>
  <text x="378" y="231" font-size="9.5" fill="var(--color-text-secondary,#6b6b6b)">auth state change</text>
  <rect x="60" y="340" width="430" height="92" rx="10" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.5"/>
  <text x="275" y="361" font-size="12" font-weight="700" text-anchor="middle" fill="var(--color-text-info,#2c7fb8)">signed in →</text>
  <text x="275" y="380" font-size="10" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">getUserProfile() → server tier / subscription / deleted</text>
  <text x="275" y="395" font-size="10" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">local cache → prefs only · getPortfolios() + getCoins(active)/getCoinsMeta(rest)</text>
  <text x="275" y="410" font-size="10" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">checkSubscriptionStatus() → setUser()</text>
  <text x="275" y="426" font-size="10.5" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">→ screen: "portfolio"</text>
  <rect x="540" y="340" width="300" height="92" rx="10" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.5"/>
  <text x="690" y="365" font-size="12" font-weight="700" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">signed out →</text>
  <text x="690" y="388" font-size="10.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">setUser(null)</text>
  <text x="690" y="410" font-size="10.5" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">→ screen: "login"</text>
  <line x1="300" y1="302" x2="275" y2="338" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.5" marker-end="url(#as_a)"/>
  <text x="250" y="322" font-size="9.5" fill="var(--color-text-info,#2c7fb8)">user</text>
  <line x1="430" y1="302" x2="690" y2="338" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.5" marker-end="url(#as_a)"/>
  <text x="560" y="322" font-size="9.5" fill="var(--color-text-secondary,#6b6b6b)">null</text>
  <rect x="24" y="460" width="852" height="116" rx="10" fill="var(--color-background-primary,#fff)" stroke="var(--color-border-secondary,#d0d0d0)" stroke-width="1.3"/>
  <text x="40" y="482" font-size="11.5" font-weight="700" fill="var(--color-text-primary,#1a1a1a)">Security notes</text>
  <text x="40" y="502" font-size="11" fill="var(--color-text-secondary,#6b6b6b)">• Password is held by Firebase Auth and is NEVER stored on the device or in Firestore.</text>
  <text x="40" y="520" font-size="11" fill="var(--color-text-secondary,#6b6b6b)">• tier / subscription / soft-delete are read from Firestore (server-authoritative) so they're correct on a fresh device; local cache holds only prefs.</text>
  <text x="40" y="538" font-size="11" fill="var(--color-text-secondary,#6b6b6b)">• Admin = a verified custom claim {admin:true} read via getIdTokenResult — never an email list; the /admin app re-checks it and signs out non-admins.</text>
  <text x="40" y="556" font-size="11" fill="var(--color-text-secondary,#6b6b6b)">• Logout → signOut() → onAuthChange fires null → Login. Register sends a (non-fatal) verification email. Password complexity enforced on register, not login.</text>
  <text x="40" y="571" font-size="9" fill="var(--color-text-secondary,#6b6b6b)">Source: src/api/firebase-auth.js · src/hooks/useAuthSession.js</text>
</svg>