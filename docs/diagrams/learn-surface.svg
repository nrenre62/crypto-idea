<svg role="img" viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,sans-serif">
  <title>Learn surface — content, progress, and the quiz gate</title>
  <desc>Static lesson content and the live Firestore progress doc meet in the useLearn hook, which derives all gamification state and gates XP behind passed quizzes; failed saves revert and toast.</desc>
  <defs>
    <marker id="l1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8z" fill="var(--color-text-secondary, #6b6b6b)"/></marker>
  </defs>
  <text x="20" y="28" font-size="15" font-weight="700" fill="var(--color-text-primary, #1a1a1a)">Learn — content × live progress × the quiz gate</text>

  <rect x="20" y="52" width="190" height="70" rx="8" fill="var(--color-background-primary, #fff)" stroke="var(--color-border-secondary, #d0d0d0)"/>
  <text x="115" y="74" font-size="12" font-weight="600" text-anchor="middle" fill="var(--color-text-primary, #1a1a1a)">src/data/learn/*</text>
  <text x="115" y="92" font-size="10" text-anchor="middle" fill="var(--color-text-secondary, #6b6b6b)">9 modules · 50 lessons</text>
  <text x="115" y="107" font-size="10" text-anchor="middle" fill="var(--color-text-secondary, #6b6b6b)">no-names voice · test-locked</text>

  <rect x="285" y="52" width="190" height="70" rx="8" fill="var(--color-background-primary, #fff)" stroke="var(--color-border-secondary, #d0d0d0)"/>
  <text x="380" y="74" font-size="12" font-weight="600" text-anchor="middle" fill="var(--color-text-primary, #1a1a1a)">useLearn</text>
  <text x="380" y="92" font-size="10" text-anchor="middle" fill="var(--color-text-secondary, #6b6b6b)">level · streak · module states</text>
  <text x="380" y="107" font-size="10" text-anchor="middle" fill="var(--color-text-secondary, #6b6b6b)">ALL derived, never stored</text>

  <rect x="550" y="52" width="190" height="70" rx="8" fill="var(--color-background-primary, #fff)" stroke="var(--color-border-secondary, #d0d0d0)"/>
  <text x="645" y="74" font-size="12" font-weight="600" text-anchor="middle" fill="var(--color-text-primary, #1a1a1a)">Learn.jsx</text>
  <text x="645" y="92" font-size="10" text-anchor="middle" fill="var(--color-text-secondary, #6b6b6b)">hero XP bar · module cards</text>
  <text x="645" y="107" font-size="10" text-anchor="middle" fill="var(--color-text-secondary, #6b6b6b)">R20 player: Prev | Submit→Next/Done</text>

  <line x1="210" y1="87" x2="283" y2="87" stroke="var(--color-text-secondary, #6b6b6b)" marker-end="url(#l1)"/>
  <line x1="475" y1="87" x2="548" y2="87" stroke="var(--color-text-secondary, #6b6b6b)" marker-end="url(#l1)"/>

  <rect x="285" y="200" width="190" height="78" rx="8" fill="var(--color-background-primary, #fff)" stroke="var(--color-text-primary, #1a1a1a)"/>
  <text x="380" y="222" font-size="12" font-weight="600" text-anchor="middle" fill="var(--color-text-primary, #1a1a1a)">users/{uid}/learn/progress</text>
  <text x="380" y="240" font-size="10" text-anchor="middle" fill="var(--color-text-secondary, #6b6b6b)">xp · streak · completedLessons[]</text>
  <text x="380" y="255" font-size="10" text-anchor="middle" fill="var(--color-text-secondary, #6b6b6b)">validLearnProgress: owner-only,</text>
  <text x="380" y="269" font-size="10" text-anchor="middle" fill="var(--color-text-secondary, #6b6b6b)">bounded + closed shape</text>

  <line x1="340" y1="198" x2="340" y2="124" stroke="var(--color-text-secondary, #6b6b6b)" marker-end="url(#l1)"/>
  <text x="332" y="165" font-size="9.5" text-anchor="end" fill="var(--color-text-secondary, #6b6b6b)">watchLearnProgress (onSnapshot)</text>
  <text x="332" y="178" font-size="9.5" text-anchor="end" fill="var(--color-text-secondary, #6b6b6b)">C-A3: a 2nd device's XP appears live</text>

  <line x1="420" y1="124" x2="420" y2="198" stroke="var(--color-text-secondary, #6b6b6b)" marker-end="url(#l1)"/>
  <text x="428" y="152" font-size="9.5" fill="var(--color-text-secondary, #6b6b6b)">quiz PASSED → complete(lesson)</text>
  <text x="428" y="165" font-size="9.5" fill="var(--color-text-secondary, #6b6b6b)">saveLearnProgress AWAITED (C-R2e):</text>
  <text x="428" y="178" font-size="9.5" fill="var(--color-text-secondary, #6b6b6b)">failure → revert XP + toast, no phantom progress</text>

  <text x="30" y="320" font-size="11" font-weight="600" fill="var(--color-text-primary, #1a1a1a)">Invariants:</text>
  <text x="30" y="338" font-size="10" fill="var(--color-text-secondary, #6b6b6b)">• XP only ever moves through a passed quiz (re-completes are a no-op — no double XP) · modules unlock sequentially · Review replays a done module fresh</text>
  <text x="30" y="354" font-size="10" fill="var(--color-text-secondary, #6b6b6b)">• level / badges / module states are recomputed from completedLessons on every render — the doc stores only facts, so the derivations can never drift</text>

  <text x="20" y="386" font-size="10" fill="var(--color-text-secondary, #6b6b6b)">Legend: grey = app flow · dark border = Firestore (owner-only, rules-validated).</text>
</svg>
