<svg viewBox="0 0 900 580" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
  <title>Crypto Idea — admin dashboard operations</title>
  <desc>The separate admin app calls admin-only callables, each gated by a verified role claim. Admin has two roles: owner and manager. Read/insight callables are open to any admin and return aggregates and operational data (never holdings); account mutations are manager-or-owner; permanent erasure is owner-only; Settings and role grants additionally require a recent password re-auth. Owner accounts can never be deleted, trashed or demoted, and a manager may not act on an owner. Every mutation appends to a server-only audit log.</desc>
  <defs>
    <marker id="ad_a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--color-text-secondary,#6b6b6b)"/></marker>
  </defs>
  <text x="24" y="28" font-size="19" font-weight="700" fill="var(--color-text-primary,#1a1a1a)">Admin Dashboard Operations</text>
  <text x="24" y="47" font-size="12" fill="var(--color-text-secondary,#6b6b6b)">Separate /admin app · every callable verifies the role claim server-side · mutations are audited</text>
  <line x1="640" y1="26" x2="664" y2="26" stroke="var(--color-text-info,#2c7fb8)" stroke-width="2.5"/><text x="670" y="30" font-size="10.5" fill="var(--color-text-secondary,#6b6b6b)">read/insight</text>
  <line x1="765" y1="26" x2="789" y2="26" stroke="var(--color-text-primary,#1a1a1a)" stroke-width="2.5"/><text x="795" y="30" font-size="10.5" fill="var(--color-text-secondary,#6b6b6b)">mutation</text>
  <rect x="290" y="62" width="320" height="44" rx="9" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-info,#2c7fb8)" stroke-width="1.7"/>
  <text x="450" y="80" font-size="12" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">Admin app (/admin · admin.html)</text>
  <text x="450" y="96" font-size="9" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">re-checks the admin claim + role · signs out non-admins</text>
  <rect x="290" y="118" width="320" height="34" rx="8" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-primary,#1a1a1a)" stroke-width="1.6"/>
  <text x="450" y="139" font-size="11" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">gates: assertAdmin / assertManager / assertOwner / assertFreshOwner</text>
  <line x1="450" y1="106" x2="450" y2="116" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.5" marker-end="url(#ad_a)"/>
  <rect x="40" y="174" width="392" height="196" rx="10" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-info,#2c7fb8)" stroke-width="1.5"/>
  <text x="56" y="195" font-size="11.5" font-weight="700" fill="var(--color-text-primary,#1a1a1a)">Read / insight (no personal holdings, ever)</text>
  <text x="56" y="216" font-size="10" fill="var(--color-text-primary,#1a1a1a)">getStats</text><text x="424" y="216" font-size="9" text-anchor="end" fill="var(--color-text-secondary,#6b6b6b)">aggregate counts + revenue (group count)</text>
  <text x="56" y="240" font-size="10" fill="var(--color-text-primary,#1a1a1a)">listUsers</text><text x="424" y="240" font-size="9" text-anchor="end" fill="var(--color-text-secondary,#6b6b6b)">Auth+profile merge · operational · cap 5000</text>
  <text x="56" y="264" font-size="10" fill="var(--color-text-primary,#1a1a1a)">lookupUser(email)</text><text x="424" y="264" font-size="9" text-anchor="end" fill="var(--color-text-secondary,#6b6b6b)">one user: tier / status / usage</text>
  <text x="56" y="288" font-size="10" fill="var(--color-text-primary,#1a1a1a)">listAudit</text><text x="424" y="288" font-size="9" text-anchor="end" fill="var(--color-text-secondary,#6b6b6b)">recent admin actions</text>
  <text x="56" y="312" font-size="10" fill="var(--color-text-primary,#1a1a1a)">getAdminConfig</text><text x="424" y="312" font-size="9" text-anchor="end" fill="var(--color-text-secondary,#6b6b6b)">OWNER + re-auth · secrets as set-flags</text>
  <text x="56" y="340" font-size="9" fill="var(--color-text-secondary,#6b6b6b)">Overview = aggregates only; the full user list is</text>
  <text x="56" y="354" font-size="9" fill="var(--color-text-secondary,#6b6b6b)">searched + paginated client-side (50/page).</text>
  <rect x="468" y="174" width="392" height="196" rx="10" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-primary,#1a1a1a)" stroke-width="1.5"/>
  <text x="484" y="195" font-size="11.5" font-weight="700" fill="var(--color-text-primary,#1a1a1a)">Mutations (each writeAudit'd)</text>
  <text x="484" y="216" font-size="10" fill="var(--color-text-primary,#1a1a1a)">setUserTier(uid,tier)</text><text x="852" y="216" font-size="9" text-anchor="end" fill="var(--color-text-secondary,#6b6b6b)">free / pro / premium</text>
  <text x="484" y="240" font-size="10" fill="var(--color-text-primary,#1a1a1a)">suspendUser(uid)</text><text x="852" y="240" font-size="9" text-anchor="end" fill="var(--color-text-secondary,#6b6b6b)">Auth disable (reversible) · never an owner</text>
  <text x="484" y="264" font-size="10" fill="var(--color-text-primary,#1a1a1a)">deleteUser(uid)</text><text x="852" y="264" font-size="9" text-anchor="end" fill="var(--color-text-secondary,#6b6b6b)">OWNER only · recursiveDelete + Auth delete (GDPR)</text>
  <text x="484" y="288" font-size="10" fill="var(--color-text-primary,#1a1a1a)">setManagerRole(email)</text><text x="852" y="288" font-size="9" text-anchor="end" fill="var(--color-text-secondary,#6b6b6b)">OWNER + re-auth · grants MANAGER only</text>
  <text x="484" y="312" font-size="10" fill="var(--color-text-primary,#1a1a1a)">saveConfig</text><text x="852" y="312" font-size="9" text-anchor="end" fill="var(--color-text-secondary,#6b6b6b)">OWNER + re-auth · write locked config/app</text>
  <text x="484" y="340" font-size="9" fill="var(--color-text-secondary,#6b6b6b)">→ Firestore / Firebase Auth, then writeAudit()</text>
  <text x="484" y="354" font-size="9" fill="var(--color-text-secondary,#6b6b6b)">appends to the server-only audit collection.</text>
  <line x1="370" y1="152" x2="240" y2="172" stroke="var(--color-text-info,#2c7fb8)" stroke-width="1.4" marker-end="url(#ad_a)"/>
  <line x1="530" y1="152" x2="660" y2="172" stroke="var(--color-text-primary,#1a1a1a)" stroke-width="1.4" marker-end="url(#ad_a)"/>
  <rect x="468" y="384" width="392" height="34" rx="8" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-primary,#1a1a1a)" stroke-width="1.4"/>
  <text x="664" y="405" font-size="10.5" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">audit collection (append-only · server-only · rules deny clients)</text>
  <line x1="664" y1="370" x2="664" y2="382" stroke="var(--color-text-primary,#1a1a1a)" stroke-width="1.4" marker-end="url(#ad_a)"/>
  <rect x="24" y="438" width="852" height="128" rx="10" fill="var(--color-background-primary,#fff)" stroke="var(--color-border-secondary,#d0d0d0)" stroke-width="1.3"/>
  <text x="40" y="460" font-size="11.5" font-weight="700" fill="var(--color-text-primary,#1a1a1a)">Guards</text>
  <text x="40" y="480" font-size="11" fill="var(--color-text-secondary,#6b6b6b)">• Every callable verifies the claim AND role server-side — a different URL is NOT the boundary, and neither is the UI.</text>
  <text x="40" y="498" font-size="11" fill="var(--color-text-secondary,#6b6b6b)">• Self-target blocked: an admin can't suspend or delete their own account (uid === context.auth.uid).</text>
  <text x="40" y="516" font-size="11" fill="var(--color-text-secondary,#6b6b6b)">• Owners are protected by IDENTITY: never deletable, trashable, demotable or self-deletable. MIN_ADMINS=2 is only a secondary floor.</text>
  <text x="40" y="534" font-size="11" fill="var(--color-text-secondary,#6b6b6b)">• Privacy by design: no callable returns user holdings; Overview is aggregate-only.</text>
  <text x="40" y="552" font-size="9" fill="var(--color-text-secondary,#6b6b6b)">Source: functions/index.js + functions/guards.js — roleOf, requireOwner, requireFreshAuth, setManagerRole, assertTargetAllowed, writeAudit</text>
</svg>