<svg viewBox="0 0 900 470" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
  <title>Crypto Idea — Firestore data model</title>
  <desc>User-owned data nests users → portfolios → coins → transactions, each parent holding a counter (portfolioCount, coinCount, txCount) maintained by batched increments and enforced by security rules. Separate top-level docs (config/app, cache/universe, historyCache, audit) are server-only.</desc>
  <text x="24" y="30" font-size="19" font-weight="700" fill="var(--color-text-primary,#1a1a1a)">Firestore Data Model</text>
  <text x="24" y="50" font-size="12.5" fill="var(--color-text-secondary,#6b6b6b)">Nested owner-only tree + counters · separate server-only collections</text>
  <line x1="600" y1="28" x2="624" y2="28" stroke="var(--color-text-info,#2c7fb8)" stroke-width="2.5"/><text x="630" y="32" font-size="11" fill="var(--color-text-secondary,#6b6b6b)">user-owned</text>
  <line x1="715" y1="28" x2="739" y2="28" stroke="var(--color-text-primary,#1a1a1a)" stroke-width="2.5"/><text x="745" y="32" font-size="11" fill="var(--color-text-secondary,#6b6b6b)">server-only</text>
  <rect x="40" y="80" width="560" height="54" rx="9" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-info,#2c7fb8)" stroke-width="1.7"/>
  <text x="54" y="102" font-size="13" font-weight="700" fill="var(--color-text-primary,#1a1a1a)">users/{uid}</text>
  <text x="54" y="121" font-size="9.5" fill="var(--color-text-secondary,#6b6b6b)">email · name · tier · joined · lastLogin · settings</text>
  <text x="586" y="111" font-size="10" font-weight="700" text-anchor="end" fill="var(--color-text-info,#2c7fb8)">▸ portfolioCount</text>
  <rect x="84" y="150" width="516" height="54" rx="9" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-info,#2c7fb8)" stroke-width="1.5"/>
  <text x="98" y="172" font-size="12.5" font-weight="700" fill="var(--color-text-primary,#1a1a1a)">portfolios/{portfolioId}</text>
  <text x="98" y="191" font-size="9.5" fill="var(--color-text-secondary,#6b6b6b)">name · created · order</text>
  <text x="586" y="181" font-size="10" font-weight="700" text-anchor="end" fill="var(--color-text-info,#2c7fb8)">▸ coinCount</text>
  <rect x="128" y="220" width="472" height="54" rx="9" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-info,#2c7fb8)" stroke-width="1.5"/>
  <text x="142" y="242" font-size="12.5" font-weight="700" fill="var(--color-text-primary,#1a1a1a)">coins/{coinId}</text>
  <text x="142" y="261" font-size="9.5" fill="var(--color-text-secondary,#6b6b6b)">id · symbol · name · thumb · addedAt</text>
  <text x="586" y="251" font-size="10" font-weight="700" text-anchor="end" fill="var(--color-text-info,#2c7fb8)">▸ txCount</text>
  <rect x="172" y="290" width="428" height="50" rx="9" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-info,#2c7fb8)" stroke-width="1.5"/>
  <text x="186" y="311" font-size="12.5" font-weight="700" fill="var(--color-text-primary,#1a1a1a)">transactions/{txId}</text>
  <text x="186" y="329" font-size="9.5" fill="var(--color-text-secondary,#6b6b6b)">type · amount · priceAtBuy · date · createdAt</text>
  <polyline points="54,134 54,177 82,177" fill="none" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.3"/>
  <polyline points="98,204 98,247 126,247" fill="none" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.3"/>
  <polyline points="142,274 142,315 170,315" fill="none" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.3"/>
  <text x="630" y="74" font-size="10.5" font-weight="700" fill="var(--color-text-secondary,#6b6b6b)">Top-level · server-only (rules deny clients)</text>
  <rect x="630" y="82" width="246" height="46" rx="8" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-primary,#1a1a1a)" stroke-width="1.8"/>
  <text x="642" y="103" font-size="11.5" font-weight="700" fill="var(--color-text-primary,#1a1a1a)">config/app — LOCKED</text>
  <text x="642" y="119" font-size="9" fill="var(--color-text-secondary,#6b6b6b)">API keys · flags · plans (read,write:false)</text>
  <rect x="630" y="136" width="246" height="40" rx="8" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-primary,#1a1a1a)" stroke-width="1.4"/>
  <text x="642" y="153" font-size="11.5" font-weight="700" fill="var(--color-text-primary,#1a1a1a)">cache/universe</text>
  <text x="642" y="168" font-size="9" fill="var(--color-text-secondary,#6b6b6b)">~3,000 coins (metadata + price)</text>
  <rect x="630" y="184" width="246" height="40" rx="8" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-primary,#1a1a1a)" stroke-width="1.4"/>
  <text x="642" y="201" font-size="11.5" font-weight="700" fill="var(--color-text-primary,#1a1a1a)">historyCache/{coin}</text>
  <text x="642" y="216" font-size="9" fill="var(--color-text-secondary,#6b6b6b)">daily price history (30-day TTL)</text>
  <rect x="630" y="232" width="246" height="40" rx="8" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-primary,#1a1a1a)" stroke-width="1.4"/>
  <text x="642" y="249" font-size="11.5" font-weight="700" fill="var(--color-text-primary,#1a1a1a)">audit</text>
  <text x="642" y="264" font-size="9" fill="var(--color-text-secondary,#6b6b6b)">admin actions (append-only, server-only)</text>
  <rect x="24" y="356" width="852" height="98" rx="10" fill="var(--color-background-primary,#fff)" stroke="var(--color-border-secondary,#d0d0d0)" stroke-width="1.3"/>
  <text x="40" y="378" font-size="11.5" font-weight="700" fill="var(--color-text-primary,#1a1a1a)">Counters = how tier limits are enforced</text>
  <text x="40" y="398" font-size="11" fill="var(--color-text-secondary,#6b6b6b)">• Each parent stores a child counter; every create/delete uses writeBatch + increment(±1) to keep it in sync (firebase-database.js).</text>
  <text x="40" y="416" font-size="11" fill="var(--color-text-secondary,#6b6b6b)">• firestore.rules require each create to bump the parent counter by exactly +1 AND keep it ≤ the tier max (read from config/app.plans).</text>
  <text x="40" y="434" font-size="11" fill="var(--color-text-secondary,#6b6b6b)">• So plan limits are enforced server-side, not just in the UI. Owner-only access: a user reads/writes only their own users/{uid} subtree; admins can read all.</text>
  <text x="40" y="449" font-size="9" fill="var(--color-text-secondary,#6b6b6b)">Source: src/api/firebase-database.js · firestore.rules</text>
</svg>