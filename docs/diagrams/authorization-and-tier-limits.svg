<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
  <title>Crypto Idea — authorization &amp; tier limits</title>
  <desc>Every Firestore write passes rule gates: signed in, owner or admin, field guards (no self tier change, validation), and a counter guard that requires the parent counter to increment by one and stay within the tier limit. Tier limits come from config/app.plans with built-in defaults, enforced server-side.</desc>
  <defs>
    <marker id="az_a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--color-text-secondary,#6b6b6b)"/></marker>
    <marker id="az_d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--color-text-primary,#1a1a1a)"/></marker>
  </defs>
  <text x="24" y="30" font-size="19" font-weight="700" fill="var(--color-text-primary,#1a1a1a)">Authorization &amp; Tier Limits</text>
  <text x="24" y="50" font-size="12.5" fill="var(--color-text-secondary,#6b6b6b)">firestore.rules is the security boundary — every write runs the gates; deny by default</text>
  <line x1="600" y1="28" x2="624" y2="28" stroke="var(--color-text-info,#2c7fb8)" stroke-width="2.5"/><text x="630" y="32" font-size="11" fill="var(--color-text-secondary,#6b6b6b)">allow path</text>
  <line x1="705" y1="28" x2="729" y2="28" stroke="var(--color-text-primary,#1a1a1a)" stroke-width="2.5"/><text x="735" y="32" font-size="11" fill="var(--color-text-secondary,#6b6b6b)">deny</text>
  <text x="40" y="74" font-size="11" font-weight="700" fill="var(--color-text-secondary,#6b6b6b)">Client write request →</text>
  <rect x="40" y="82" width="320" height="40" rx="8" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-info,#2c7fb8)" stroke-width="1.6"/>
  <text x="200" y="100" font-size="11.5" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">1 · isSignedIn()</text>
  <text x="200" y="115" font-size="9" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">request.auth != null</text>
  <rect x="40" y="134" width="320" height="46" rx="8" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-info,#2c7fb8)" stroke-width="1.6"/>
  <text x="200" y="153" font-size="11.5" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">2 · isOwner(uid)  OR  isAdmin()</text>
  <text x="200" y="169" font-size="9" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">uid matches path · admin = {admin:true} claim</text>
  <rect x="40" y="192" width="320" height="52" rx="8" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-info,#2c7fb8)" stroke-width="1.6"/>
  <text x="200" y="210" font-size="11.5" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">3 · Field guards</text>
  <text x="200" y="225" font-size="9" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">owner can't change tier/joined · create tier must = 'free'</text>
  <text x="200" y="238" font-size="9" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">validation bounds type + SIZE + RANGE</text>
  <rect x="40" y="256" width="320" height="56" rx="8" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-info,#2c7fb8)" stroke-width="1.6"/>
  <text x="200" y="275" font-size="11.5" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">4 · Counter + limit guard (on create)</text>
  <text x="200" y="290" font-size="9" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">parent counter == prev + 1  AND  ≤ tier max</text>
  <text x="200" y="303" font-size="9" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">updates may move a counter by ±1 only</text>
  <rect x="40" y="324" width="320" height="38" rx="8" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-info,#2c7fb8)" stroke-width="2"/>
  <text x="200" y="348" font-size="12.5" font-weight="700" text-anchor="middle" fill="var(--color-text-info,#2c7fb8)">✓ ALLOW write</text>
  <line x1="200" y1="122" x2="200" y2="132" stroke="var(--color-text-info,#2c7fb8)" stroke-width="1.5" marker-end="url(#az_a)"/>
  <line x1="200" y1="180" x2="200" y2="190" stroke="var(--color-text-info,#2c7fb8)" stroke-width="1.5" marker-end="url(#az_a)"/>
  <line x1="200" y1="244" x2="200" y2="254" stroke="var(--color-text-info,#2c7fb8)" stroke-width="1.5" marker-end="url(#az_a)"/>
  <line x1="200" y1="312" x2="200" y2="322" stroke="var(--color-text-info,#2c7fb8)" stroke-width="1.5" marker-end="url(#az_a)"/>
  <rect x="392" y="180" width="128" height="60" rx="9" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-primary,#1a1a1a)" stroke-width="1.8"/>
  <text x="456" y="206" font-size="13" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">✗ DENY</text>
  <text x="456" y="224" font-size="9" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">any gate fails</text>
  <line x1="360" y1="102" x2="392" y2="196" stroke="var(--color-text-primary,#1a1a1a)" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#az_d)"/>
  <line x1="360" y1="157" x2="392" y2="205" stroke="var(--color-text-primary,#1a1a1a)" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#az_d)"/>
  <line x1="360" y1="218" x2="392" y2="216" stroke="var(--color-text-primary,#1a1a1a)" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#az_d)"/>
  <line x1="360" y1="284" x2="392" y2="230" stroke="var(--color-text-primary,#1a1a1a)" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#az_d)"/>
  <rect x="556" y="78" width="320" height="200" rx="10" fill="var(--color-background-primary,#fff)" stroke="var(--color-border-secondary,#d0d0d0)" stroke-width="1.4"/>
  <text x="572" y="100" font-size="11.5" font-weight="700" fill="var(--color-text-primary,#1a1a1a)">Tier limits (portfolios / coins / tx)</text>
  <line x1="572" y1="108" x2="860" y2="108" stroke="var(--color-border-tertiary,#e2e2e2)" stroke-width="1"/>
  <text x="572" y="128" font-size="11" font-weight="700" fill="var(--color-text-info,#2c7fb8)">free (Starter)</text>
  <text x="860" y="128" font-size="11" text-anchor="end" fill="var(--color-text-secondary,#6b6b6b)">3 / 30 / 300</text>
  <text x="572" y="150" font-size="11" font-weight="700" fill="var(--color-text-info,#2c7fb8)">pro</text>
  <text x="860" y="150" font-size="11" text-anchor="end" fill="var(--color-text-secondary,#6b6b6b)">6 / 100 / 1,000</text>
  <text x="572" y="172" font-size="11" font-weight="700" fill="var(--color-text-info,#2c7fb8)">premium</text>
  <text x="860" y="172" font-size="11" text-anchor="end" fill="var(--color-text-secondary,#6b6b6b)">15 / 200 / 2,000</text>
  <line x1="572" y1="184" x2="860" y2="184" stroke="var(--color-border-tertiary,#e2e2e2)" stroke-width="1"/>
  <text x="572" y="204" font-size="9.5" fill="var(--color-text-secondary,#6b6b6b)">Portfolios + tx: rules read config/app.plans via</text>
  <text x="572" y="218" font-size="9.5" fill="var(--color-text-secondary,#6b6b6b)">get()/exists() → the ENFORCED ceiling; config lowers,</text>
  <text x="572" y="232" font-size="9.5" fill="var(--color-text-secondary,#6b6b6b)">never raises past the hard-max clamp.</text>
  <text x="572" y="246" font-size="9.5" fill="var(--color-text-secondary,#6b6b6b)">COINS moved server-side (CRYP-108): coin create is</text>
  <text x="572" y="260" font-size="9.5" fill="var(--color-text-secondary,#6b6b6b)">if false; addCoinGuarded enforces coins + #20 (≤1,000).</text>
  <rect x="24" y="384" width="852" height="118" rx="10" fill="var(--color-background-primary,#fff)" stroke="var(--color-border-secondary,#d0d0d0)" stroke-width="1.3"/>
  <text x="40" y="406" font-size="11.5" font-weight="700" fill="var(--color-text-primary,#1a1a1a)">Invariants the rules guarantee</text>
  <text x="40" y="426" font-size="11" fill="var(--color-text-secondary,#6b6b6b)">• No self-upgrade: an owner can't change their own tier (only an admin can) — no paying-for-free Pro.</text>
  <text x="40" y="444" font-size="11" fill="var(--color-text-secondary,#6b6b6b)">• Counters can't be smuggled: a single write moves a counter by at most ±1, so a limit can't be bypassed by resetting it.</text>
  <text x="40" y="462" font-size="11" fill="var(--color-text-secondary,#6b6b6b)">• config/app and audit are fully locked (read,write:false) — only Cloud Functions (Admin SDK) touch them.</text>
  <text x="40" y="480" font-size="11" fill="var(--color-text-secondary,#6b6b6b)">• Validation bounds type, SIZE and RANGE (e.g. name ≤ 64 chars, amount ≤ 1e15) — type-only checks are a storage/abuse vector.</text>
  <text x="40" y="495" font-size="9" fill="var(--color-text-secondary,#6b6b6b)">Source: firestore.rules (portfolios/tx) + functions/coin-limits.js + addCoinGuarded (coins) · limits: useUpgrade.js + DEFAULT_PLANS</text>
</svg>