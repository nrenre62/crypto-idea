<svg viewBox="0 0 900 640" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
  <title>Crypto Idea — coin data flow (DCA vs App)</title>
  <desc>The DCA calculator and the user app read coin metadata, prices and history from one shared Firestore cache. Scheduled jobs make the only upstream calls to CoinGecko: a 5-minute refresh of the hot top ~1,300 coins, a daily refresh of all ~3,000, and on-demand fetches for off-list coins and per-coin history. Cost is flat regardless of user count.</desc>

  <defs>
    <marker id="d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--color-text-info, #2c7fb8)"/></marker>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--color-text-secondary, #6b6b6b)"/></marker>
    <marker id="u" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--color-text-primary, #1a1a1a)"/></marker>
  </defs>

  <text x="24" y="30" font-size="19" font-weight="700" fill="var(--color-text-primary, #1a1a1a)">Crypto Idea — Coin Data Flow</text>
  <text x="24" y="51" font-size="12.5" fill="var(--color-text-secondary, #6b6b6b)">DCA reads cache only (0 user-triggered API calls) · App: hot 1,300 live + tail on demand · one shared cache · one upstream</text>
  <line x1="640" y1="26" x2="664" y2="26" stroke="var(--color-text-info, #2c7fb8)" stroke-width="2.5"/><text x="670" y="30" font-size="11" fill="var(--color-text-secondary,#6b6b6b)">DCA</text>
  <line x1="715" y1="26" x2="739" y2="26" stroke="var(--color-text-secondary, #6b6b6b)" stroke-width="2.5"/><text x="745" y="30" font-size="11" fill="var(--color-text-secondary,#6b6b6b)">App</text>
  <line x1="790" y1="26" x2="814" y2="26" stroke="var(--color-text-primary, #1a1a1a)" stroke-width="2.5"/><text x="820" y="30" font-size="11" fill="var(--color-text-secondary,#6b6b6b)">refresh</text>

  <!-- Front-ends -->
  <rect x="40" y="70" width="370" height="58" rx="10" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-info,#2c7fb8)" stroke-width="2"/>
  <text x="225" y="95" font-size="14.5" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">DCA Calculator (landing)</text>
  <text x="225" y="115" font-size="11" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">free · no login · searches client-side</text>

  <rect x="490" y="70" width="370" height="58" rx="10" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="2"/>
  <text x="675" y="95" font-size="14.5" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">User App (tracker)</text>
  <text x="675" y="115" font-size="11" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">signed-in · live prices · holdings</text>

  <!-- Endpoints -->
  <rect x="46" y="160" width="172" height="44" rx="8" fill="var(--color-background-primary,#fff)" stroke="var(--color-border-secondary,#d0d0d0)" stroke-width="1.3"/>
  <text x="132" y="179" font-size="12" font-weight="600" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">/api/coinlist</text>
  <text x="132" y="195" font-size="10" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">list+price · CDN 24h</text>
  <rect x="232" y="160" width="172" height="44" rx="8" fill="var(--color-background-primary,#fff)" stroke="var(--color-border-secondary,#d0d0d0)" stroke-width="1.3"/>
  <text x="318" y="179" font-size="12" font-weight="600" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">/api/history</text>
  <text x="318" y="195" font-size="10" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">full history · cached</text>

  <rect x="496" y="160" width="172" height="44" rx="8" fill="var(--color-background-primary,#fff)" stroke="var(--color-border-secondary,#d0d0d0)" stroke-width="1.3"/>
  <text x="582" y="179" font-size="12" font-weight="600" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">/api/search</text>
  <text x="582" y="195" font-size="10" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">name/symbol</text>
  <rect x="682" y="160" width="172" height="44" rx="8" fill="var(--color-background-primary,#fff)" stroke="var(--color-border-secondary,#d0d0d0)" stroke-width="1.3"/>
  <text x="768" y="179" font-size="12" font-weight="600" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">/api/prices</text>
  <text x="768" y="195" font-size="10" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">live · polled 60s</text>

  <line x1="170" y1="128" x2="140" y2="158" stroke="var(--color-text-info,#2c7fb8)" stroke-width="1.6" marker-end="url(#d)"/>
  <line x1="285" y1="128" x2="312" y2="158" stroke="var(--color-text-info,#2c7fb8)" stroke-width="1.6" marker-end="url(#d)"/>
  <line x1="610" y1="128" x2="588" y2="158" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="740" y1="128" x2="762" y2="158" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- Cache band -->
  <rect x="40" y="246" width="820" height="132" rx="12" fill="none" stroke="var(--color-border-tertiary,#e2e2e2)" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="56" y="268" font-size="12" font-weight="700" fill="var(--color-text-secondary,#6b6b6b)">FIRESTORE CACHE (shared · cost flat regardless of users)</text>

  <rect x="70" y="284" width="470" height="80" rx="9" fill="var(--color-background-primary,#fff)" stroke="var(--color-border-secondary,#d0d0d0)" stroke-width="1.5"/>
  <text x="305" y="308" font-size="13" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">cache/universe — ~3,000 coins (metadata + price)</text>
  <text x="305" y="328" font-size="10.5" text-anchor="middle" fill="var(--color-text-info,#2c7fb8)">hot top ~1,300: price refreshed every 5 min</text>
  <text x="305" y="345" font-size="10.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">tail 1,300–3,000: metadata daily · price fetched on demand when held</text>
  <text x="305" y="360" font-size="10" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">per-coin timestamp drives fresh-vs-refetch</text>

  <rect x="560" y="284" width="276" height="80" rx="9" fill="var(--color-background-primary,#fff)" stroke="var(--color-border-secondary,#d0d0d0)" stroke-width="1.5"/>
  <text x="698" y="308" font-size="13" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">historyCache/{coin}</text>
  <text x="698" y="328" font-size="10.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">full daily history per coin</text>
  <text x="698" y="344" font-size="10.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">fetched once, reused by all</text>
  <text x="698" y="360" font-size="10" text-anchor="middle" fill="var(--color-text-info,#2c7fb8)">with key: full range (BTC 2013→)</text>

  <line x1="132" y1="204" x2="200" y2="282" stroke="var(--color-text-info,#2c7fb8)" stroke-width="1.5" marker-end="url(#d)"/>
  <line x1="318" y1="204" x2="660" y2="282" stroke="var(--color-text-info,#2c7fb8)" stroke-width="1.3" marker-end="url(#d)"/>
  <line x1="582" y1="204" x2="360" y2="282" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.3" marker-end="url(#a)"/>
  <line x1="768" y1="204" x2="430" y2="282" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Jobs -->
  <rect x="70" y="416" width="225" height="48" rx="9" fill="var(--color-background-primary,#fff)" stroke="var(--color-border-secondary,#d0d0d0)" stroke-width="1.3"/>
  <text x="182" y="436" font-size="12" font-weight="600" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">refreshPrices</text>
  <text x="182" y="452" font-size="10" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">5 min · hot top ~1,300</text>
  <rect x="337" y="416" width="225" height="48" rx="9" fill="var(--color-background-primary,#fff)" stroke="var(--color-border-secondary,#d0d0d0)" stroke-width="1.3"/>
  <text x="449" y="436" font-size="12" font-weight="600" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">refreshUniverseDaily</text>
  <text x="449" y="452" font-size="10" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">24h · all 3,000 + prune</text>
  <rect x="604" y="416" width="232" height="48" rx="9" fill="var(--color-background-primary,#fff)" stroke="var(--color-border-secondary,#d0d0d0)" stroke-width="1.3"/>
  <text x="720" y="436" font-size="12" font-weight="600" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">on-demand fetch</text>
  <text x="720" y="452" font-size="10" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">tail price · new history</text>

  <line x1="182" y1="416" x2="230" y2="366" stroke="var(--color-text-primary,#1a1a1a)" stroke-width="1.5" marker-end="url(#u)"/>
  <line x1="449" y1="416" x2="360" y2="366" stroke="var(--color-text-primary,#1a1a1a)" stroke-width="1.5" marker-end="url(#u)"/>
  <line x1="720" y1="416" x2="710" y2="366" stroke="var(--color-text-primary,#1a1a1a)" stroke-width="1.5" marker-end="url(#u)"/>

  <!-- CoinGecko -->
  <rect x="300" y="500" width="300" height="54" rx="10" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-primary,#1a1a1a)" stroke-width="2"/>
  <text x="450" y="524" font-size="13.5" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">CoinGecko API</text>
  <text x="450" y="542" font-size="10.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">the ONLY upstream · key server-side only</text>
  <line x1="400" y1="500" x2="210" y2="466" stroke="var(--color-text-primary,#1a1a1a)" stroke-width="1.4" marker-end="url(#u)"/>
  <line x1="450" y1="500" x2="449" y2="466" stroke="var(--color-text-primary,#1a1a1a)" stroke-width="1.5" marker-end="url(#u)"/>
  <line x1="520" y1="500" x2="710" y2="466" stroke="var(--color-text-primary,#1a1a1a)" stroke-width="1.4" marker-end="url(#u)"/>

  <rect x="24" y="582" width="852" height="42" rx="9" fill="var(--color-background-primary,#fff)" stroke="var(--color-border-secondary,#d0d0d0)" stroke-width="1.3"/>
  <text x="40" y="600" font-size="11.5" font-weight="700" fill="var(--color-text-info,#2c7fb8)">Cost (hybrid):</text>
  <text x="118" y="600" font-size="11.5" fill="var(--color-text-secondary,#6b6b6b)">hot 1,300 @ 5 min ≈ ~52k calls/mo · all-3,000 @ 5 min ≈ ~105k/mo. Both need a paid CoinGecko plan; free tier degrades.</text>
  <text x="40" y="617" font-size="11" fill="var(--color-text-secondary,#6b6b6b)">DCA users never trigger CoinGecko (cache-only). App tail/history coins: fetched once, then shared — flat by distinct coins, not users.</text>
</svg>