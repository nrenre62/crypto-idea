<svg viewBox="0 0 900 580" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
  <title>Crypto Idea — app buy-date history (useCoinHistory + priceAtDate)</title>
  <desc>When a user adds a buy/sell in the app, the AddEntry form auto-fills an accurate price for the chosen date. useCoinHistory fetches the selected coin's full daily history once (module-cached, then the shared /api/history proxy, then CoinGecko with a long cache). priceAtDate binary-searches that history for the last point on or before the buy date; if history isn't loaded it falls back to the built-in getHistoricalPrice estimate. The date is clamped to the coin's launch, and the result never produces NaN. Works for any coin, not just the top ones.</desc>
  <defs>
    <marker id="bh_a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--color-text-secondary,#6b6b6b)"/></marker>
    <marker id="bh_d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--color-text-primary,#1a1a1a)"/></marker>
  </defs>
  <text x="24" y="28" font-size="19" font-weight="700" fill="var(--color-text-primary,#1a1a1a)">App Buy-Date History — accurate price for any date</text>
  <text x="24" y="47" font-size="12" fill="var(--color-text-secondary,#6b6b6b)">Pick coin + date → auto-fill the price from REAL history, fall back to the built-in estimate</text>
  <line x1="560" y1="26" x2="584" y2="26" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="2.5"/><text x="590" y="30" font-size="10.5" fill="var(--color-text-secondary,#6b6b6b)">app flow</text>
  <line x1="660" y1="26" x2="684" y2="26" stroke="var(--color-text-primary,#1a1a1a)" stroke-width="2.5"/><text x="690" y="30" font-size="10.5" fill="var(--color-text-secondary,#6b6b6b)">cached proxy / upstream</text>

  <!-- AddEntry form -->
  <rect x="24" y="66" width="250" height="120" rx="10" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.7"/>
  <text x="40" y="88" font-size="12" font-weight="700" fill="var(--color-text-primary,#1a1a1a)">AddEntry form</text>
  <text x="40" y="104" font-size="9" fill="var(--color-text-secondary,#6b6b6b)">src/components/AddEntry.jsx</text>
  <text x="40" y="126" font-size="10" fill="var(--color-text-primary,#1a1a1a)">▸ select coin (sel.id)</text>
  <text x="40" y="146" font-size="10" fill="var(--color-text-primary,#1a1a1a)">▸ pick buy/sell date</text>
  <text x="40" y="166" font-size="9" fill="var(--color-text-secondary,#6b6b6b)">date clamped to coin launch (no earlier)</text>

  <!-- useCoinHistory -->
  <rect x="320" y="66" width="270" height="84" rx="10" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.6"/>
  <text x="455" y="86" font-size="11.5" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">useCoinHistory(sel.id)</text>
  <text x="455" y="103" font-size="9" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">module Map cache hit? → use it, no round-trip</text>
  <text x="455" y="119" font-size="9" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">else fetchHistory(id) once, then cache</text>
  <text x="455" y="135" font-size="9" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">prices = [[tsMs, price], …]  ·  or null</text>
  <line x1="274" y1="110" x2="318" y2="106" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.4" marker-end="url(#bh_a)"/>

  <!-- /api/history -->
  <rect x="636" y="66" width="240" height="48" rx="9" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-primary,#1a1a1a)" stroke-width="1.6"/>
  <text x="756" y="85" font-size="10.5" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">/api/history (shared proxy)</text>
  <text x="756" y="101" font-size="8.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">server cache ~30d · CDN-cached · all users</text>
  <line x1="590" y1="100" x2="634" y2="92" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.3" marker-end="url(#bh_a)"/>

  <rect x="636" y="128" width="240" height="40" rx="9" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-primary,#1a1a1a)" stroke-width="1.6"/>
  <text x="756" y="153" font-size="11" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">CoinGecko (on demand)</text>
  <line x1="756" y1="114" x2="756" y2="126" stroke="var(--color-text-primary,#1a1a1a)" stroke-width="1.3" marker-end="url(#bh_d)"/>

  <!-- priceAt decision -->
  <text x="24" y="216" font-size="12" font-weight="700" fill="var(--color-text-primary,#1a1a1a)">priceAt(date) — prefer real history, fall back to estimate</text>

  <rect x="24" y="230" width="300" height="64" rx="10" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.6"/>
  <text x="174" y="250" font-size="11" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">priceAtDate(prices, date)</text>
  <text x="174" y="267" font-size="9" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">binary search → last point on/before date</text>
  <text x="174" y="282" font-size="9" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">pure, no I/O · unit-tested</text>

  <rect x="360" y="230" width="300" height="64" rx="10" fill="var(--color-background-primary,#fff)" stroke="var(--color-border-secondary,#d0d0d0)" stroke-width="1.5"/>
  <text x="510" y="250" font-size="11" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">getHistoricalPrice(id, date)</text>
  <text x="510" y="267" font-size="9" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">built-in milestone estimate (fallback)</text>
  <text x="510" y="282" font-size="9" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">used when history is null / not finite</text>

  <rect x="696" y="230" width="180" height="64" rx="10" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.6"/>
  <text x="786" y="250" font-size="11" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">auto-fill price</text>
  <text x="786" y="267" font-size="9" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">input pre-filled;</text>
  <text x="786" y="282" font-size="9" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">"historical" badge if ±15%</text>

  <line x1="455" y1="150" x2="220" y2="228" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.3" marker-end="url(#bh_a)"/>
  <text x="300" y="196" font-size="8" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">history present</text>
  <line x1="324" y1="262" x2="358" y2="262" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.3" stroke-dasharray="3 2" marker-end="url(#bh_a)"/>
  <text x="341" y="255" font-size="7.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">null</text>
  <line x1="660" y1="262" x2="694" y2="262" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.3" marker-end="url(#bh_a)"/>
  <line x1="174" y1="186" x2="174" y2="228" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.3" marker-end="url(#bh_a)"/>
  <text x="120" y="210" font-size="8" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">on date change</text>

  <!-- notes -->
  <rect x="24" y="312" width="852" height="248" rx="10" fill="var(--color-background-primary,#fff)" stroke="var(--color-border-secondary,#d0d0d0)" stroke-width="1.3"/>
  <text x="40" y="334" font-size="11.5" font-weight="700" fill="var(--color-text-primary,#1a1a1a)">Why it's built this way</text>
  <text x="40" y="354" font-size="11" fill="var(--color-text-secondary,#6b6b6b)">• Accurate for ANY coin: the price comes from the coin's real daily history (e.g. Bitcoin back to 2013), not just the hard-coded top coins.</text>
  <text x="40" y="372" font-size="11" fill="var(--color-text-secondary,#6b6b6b)">• Three cache layers, ~0 extra cost: module Map (no round-trip on re-select) → shared /api/history (server ~30d) → CDN. One user's fetch warms it for all.</text>
  <text x="40" y="390" font-size="11" fill="var(--color-text-secondary,#6b6b6b)">• Degrade, never break: priceAtDate returns null on empty/invalid input; priceAt then uses the built-in estimate — the field always gets a finite number, never NaN.</text>
  <text x="40" y="408" font-size="11" fill="var(--color-text-secondary,#6b6b6b)">• Pure + testable: priceAtDate is a pure binary search (no I/O), unit-tested directly; the hook only owns fetching + caching.</text>
  <text x="40" y="426" font-size="11" fill="var(--color-text-secondary,#6b6b6b)">• Dates before launch are clamped: you can't pick a date earlier than the coin existed, so the auto-filled price is always meaningful.</text>
  <text x="40" y="444" font-size="11" fill="var(--color-text-secondary,#6b6b6b)">• Same shared cache as the landing DCA calculator (coin-data-flow.svg) — the app and the public calculator read the one /api/history.</text>

  <text x="40" y="476" font-size="11.5" font-weight="700" fill="var(--color-text-primary,#1a1a1a)">Lookup precedence</text>
  <text x="40" y="496" font-size="11" fill="var(--color-text-secondary,#6b6b6b)">1. real history point (priceAtDate, binary search)  →  2. built-in estimate (getHistoricalPrice)  →  always a finite, formatted price.</text>

  <text x="40" y="528" font-size="9" fill="var(--color-text-secondary,#6b6b6b)">Source: src/hooks/useCoinHistory.js · src/utils/coins.js (priceAtDate, getHistoricalPrice) · src/api/coingecko.js (fetchHistory) · src/components/AddEntry.jsx</text>
  <text x="40" y="544" font-size="9" fill="var(--color-text-secondary,#6b6b6b)">Related: coin-data-flow.svg (the shared /api/history + 30-day cache in full).</text>
</svg>
