<svg viewBox="0 0 920 650" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
  <title>Crypto Idea — multi-page build &amp; code-splitting</title>
  <desc>The Vite build has five HTML entries — the static marketing landing, privacy and terms pages, the React app, and a separate admin app — so each ships as its own page bundle and no admin code ever enters the user bundle. Inside the app, main.jsx lazy-loads each route as its own chunk behind a Suspense loading shell, and manualChunks isolates Firebase and vendor code into long-cached chunks. The result is a tiny first paint, cache reuse across deploys, and admin isolation.</desc>
  <defs>
    <marker id="mb_a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--color-text-secondary,#6b6b6b)"/></marker>
    <marker id="mb_d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--color-text-primary,#1a1a1a)"/></marker>
  </defs>
  <text x="24" y="28" font-size="19" font-weight="700" fill="var(--color-text-primary,#1a1a1a)">Multi-Page Build &amp; Code-Splitting</text>
  <text x="24" y="47" font-size="12" fill="var(--color-text-secondary,#6b6b6b)">5 HTML entries → 5 page bundles · per-route lazy chunks · Firebase &amp; vendor isolated for cache reuse</text>
  <line x1="430" y1="26" x2="454" y2="26" stroke="var(--color-text-info,#2c7fb8)" stroke-width="2.5"/><text x="460" y="30" font-size="10.5" fill="var(--color-text-secondary,#6b6b6b)">static page</text>
  <line x1="560" y1="26" x2="584" y2="26" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="2.5"/><text x="590" y="30" font-size="10.5" fill="var(--color-text-secondary,#6b6b6b)">React bundle</text>
  <line x1="700" y1="26" x2="724" y2="26" stroke="var(--color-text-primary,#1a1a1a)" stroke-width="2.5"/><text x="730" y="30" font-size="10.5" fill="var(--color-text-secondary,#6b6b6b)">build tooling</text>

  <!-- A: entries -->
  <rect x="24" y="64" width="256" height="244" rx="10" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.6"/>
  <text x="40" y="85" font-size="11.5" font-weight="700" fill="var(--color-text-primary,#1a1a1a)">HTML entries (rollupOptions.input)</text>
  <text x="40" y="110" font-size="10.5" fill="var(--color-text-info,#2c7fb8)">index.html — landing (#dca calc) · static</text>
  <text x="40" y="132" font-size="10.5" fill="var(--color-text-info,#2c7fb8)">privacy.html · terms.html · static</text>
  <text x="40" y="154" font-size="10.5" fill="var(--color-text-primary,#1a1a1a)">app.html → main.jsx · React tracker</text>
  <text x="40" y="176" font-size="10.5" fill="var(--color-text-primary,#1a1a1a)">admin.html → admin-main.jsx</text>
  <text x="52" y="192" font-size="9" fill="var(--color-text-secondary,#6b6b6b)">SEPARATE app — not in the user bundle</text>
  <line x1="40" y1="206" x2="264" y2="206" stroke="var(--color-border-tertiary,#e2e2e2)" stroke-width="1"/>
  <text x="40" y="224" font-size="9" fill="var(--color-text-secondary,#6b6b6b)">Clean URLs:</text>
  <text x="40" y="240" font-size="9" fill="var(--color-text-secondary,#6b6b6b)">dev → cleanUrlsDev middleware maps</text>
  <text x="40" y="254" font-size="9" fill="var(--color-text-secondary,#6b6b6b)">/app·/edge·/pro-success → app.html, /admin → admin.html</text>
  <text x="40" y="270" font-size="9" fill="var(--color-text-secondary,#6b6b6b)">prod → Firebase Hosting rewrites do the same</text>
  <text x="40" y="292" font-size="9" fill="var(--color-text-secondary,#6b6b6b)">Each entry = its own top-level bundle.</text>

  <!-- B: build -->
  <rect x="316" y="104" width="180" height="166" rx="10" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-primary,#1a1a1a)" stroke-width="1.7"/>
  <text x="406" y="125" font-size="11.5" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">Vite + Rollup → dist/</text>
  <text x="332" y="148" font-size="9.5" fill="var(--color-text-primary,#1a1a1a)">manualChunks(id):</text>
  <text x="344" y="163" font-size="9" fill="var(--color-text-secondary,#6b6b6b)">@firebase → "firebase"</text>
  <text x="344" y="177" font-size="9" fill="var(--color-text-secondary,#6b6b6b)">other node_modules → "vendor"</text>
  <text x="344" y="191" font-size="9" fill="var(--color-text-secondary,#6b6b6b)">our code → per-route chunks</text>
  <text x="332" y="212" font-size="9" fill="var(--color-text-secondary,#6b6b6b)">terser minify · no sourcemaps</text>
  <text x="332" y="230" font-size="9" fill="var(--color-text-secondary,#6b6b6b)">+ stamp service worker</text>
  <text x="332" y="248" font-size="9" fill="var(--color-text-secondary,#6b6b6b)">+ no-names dist guard (#24)</text>
  <text x="332" y="263" font-size="8.5" fill="var(--color-text-secondary,#6b6b6b)">build fails if it's not clean</text>
  <line x1="280" y1="186" x2="314" y2="186" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.5" marker-end="url(#mb_a)"/>

  <!-- C: dist chunks -->
  <rect x="532" y="64" width="364" height="244" rx="10" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.6"/>
  <text x="548" y="85" font-size="11.5" font-weight="700" fill="var(--color-text-primary,#1a1a1a)">dist/ — cached, parallel-loaded chunks</text>
  <text x="548" y="108" font-size="9.5" font-weight="700" fill="var(--color-text-primary,#1a1a1a)">app.html loads:</text>
  <text x="560" y="124" font-size="9" fill="var(--color-text-secondary,#6b6b6b)">main entry (tiny: router + shell)</text>
  <text x="560" y="138" font-size="9" fill="var(--color-text-secondary,#6b6b6b)">CryptoIdea · Education · ProSuccess (lazy, 1 each)</text>
  <text x="548" y="160" font-size="9.5" font-weight="700" fill="var(--color-text-primary,#1a1a1a)">shared (rarely change → long-cached):</text>
  <text x="560" y="176" font-size="9" fill="var(--color-text-secondary,#6b6b6b)">firebase  (isolated SDK chunk)</text>
  <text x="560" y="190" font-size="9" fill="var(--color-text-secondary,#6b6b6b)">vendor  (react, react-dom, …)</text>
  <text x="548" y="212" font-size="9.5" font-weight="700" fill="var(--color-text-primary,#1a1a1a)">separate top-level bundles:</text>
  <text x="560" y="228" font-size="9" fill="var(--color-text-info,#2c7fb8)">landing · privacy · terms  (static, no framework)</text>
  <text x="560" y="242" font-size="9" fill="var(--color-text-secondary,#6b6b6b)">admin entry + admin chunk  (no overlap w/ user app)</text>
  <text x="548" y="266" font-size="9" fill="var(--color-text-secondary,#6b6b6b)">Browser fetches only the chunks a page needs,</text>
  <text x="548" y="280" font-size="9" fill="var(--color-text-secondary,#6b6b6b)">in parallel; unchanged chunks stay in cache</text>
  <text x="548" y="294" font-size="9" fill="var(--color-text-secondary,#6b6b6b)">across deploys.</text>
  <line x1="496" y1="186" x2="530" y2="186" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.5" marker-end="url(#mb_a)"/>

  <!-- D: per-route split -->
  <rect x="24" y="320" width="872" height="120" rx="10" fill="var(--color-background-primary,#fff)" stroke="var(--color-text-secondary,#6b6b6b)" stroke-width="1.5"/>
  <text x="40" y="341" font-size="11.5" font-weight="700" fill="var(--color-text-primary,#1a1a1a)">Per-route code-splitting inside app.html (src/main.jsx)</text>
  <text x="40" y="361" font-size="10" fill="var(--color-text-secondary,#6b6b6b)">&lt;Suspense fallback={Loading}&gt; paints the spinner instantly · Router picks the component by window.location.pathname:</text>
  <rect x="40" y="372" width="250" height="50" rx="8" fill="var(--color-background-primary,#fff)" stroke="var(--color-border-secondary,#d0d0d0)" stroke-width="1.2"/>
  <text x="165" y="392" font-size="10" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">/app → CryptoIdea</text>
  <text x="165" y="408" font-size="8.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">lazy(() =&gt; import("./CryptoIdea.jsx"))</text>
  <rect x="310" y="372" width="250" height="50" rx="8" fill="var(--color-background-primary,#fff)" stroke="var(--color-border-secondary,#d0d0d0)" stroke-width="1.2"/>
  <text x="435" y="392" font-size="10" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">/edge → Education</text>
  <text x="435" y="408" font-size="8.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">lazy import · own chunk</text>
  <rect x="580" y="372" width="250" height="50" rx="8" fill="var(--color-background-primary,#fff)" stroke="var(--color-border-secondary,#d0d0d0)" stroke-width="1.2"/>
  <text x="705" y="392" font-size="10" font-weight="700" text-anchor="middle" fill="var(--color-text-primary,#1a1a1a)">/pro-success → ProSuccess</text>
  <text x="705" y="408" font-size="8.5" text-anchor="middle" fill="var(--color-text-secondary,#6b6b6b)">lazy import · own chunk</text>

  <!-- E: why -->
  <rect x="24" y="452" width="872" height="186" rx="10" fill="var(--color-background-primary,#fff)" stroke="var(--color-border-secondary,#d0d0d0)" stroke-width="1.3"/>
  <text x="40" y="474" font-size="11.5" font-weight="700" fill="var(--color-text-primary,#1a1a1a)">Why it's built this way</text>
  <text x="40" y="494" font-size="11" fill="var(--color-text-secondary,#6b6b6b)">• Tiny first paint: the entry chunk is just the router + React shell, so the loading spinner shows immediately; the heavy app + Firebase stream in after.</text>
  <text x="40" y="512" font-size="11" fill="var(--color-text-secondary,#6b6b6b)">• Cache reuse across deploys: Firebase + vendor are isolated; since those SDKs rarely change, returning users re-download only your changed app chunk.</text>
  <text x="40" y="530" font-size="11" fill="var(--color-text-secondary,#6b6b6b)">• Admin isolation = smaller + safer: admin.html is a separate entry, so zero admin code ships in the user bundle (the {admin:true} claim is still the real boundary).</text>
  <text x="40" y="548" font-size="11" fill="var(--color-text-secondary,#6b6b6b)">• Static stays static: landing + legal pages are plain HTML (no framework) → fast, SEO-friendly, indexable.</text>
  <text x="40" y="566" font-size="11" fill="var(--color-text-secondary,#6b6b6b)">• No package files touched: lazy() only changes how OUR code imports — Firebase/Google package files are untouched, so npm updates stay clean.</text>
  <text x="40" y="584" font-size="11" fill="var(--color-text-secondary,#6b6b6b)">• Only dist/ is deployable: the build stamps the service worker and runs the no-names guard before anything can ship.</text>
  <text x="40" y="612" font-size="9" fill="var(--color-text-secondary,#6b6b6b)">Source: vite.config.js (rollupOptions.input, manualChunks, cleanUrlsDev) · src/main.jsx (lazy + Suspense + Router) · firebase.json (Hosting rewrites).</text>
  <text x="40" y="628" font-size="9" fill="var(--color-text-secondary,#6b6b6b)">Related: service-worker + deploy (Hosting/CDN/rewrites) diagrams — backlog.</text>
</svg>
